<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lern-Cockpit</title>
<style>
:root{
  --bg:#f4f5f8; --card:#ffffff; --ink:#1b1f2a; --muted:#5d6475; --line:#dde1ea;
  --accent:#0d9488; --accent-ink:#ffffff; --ok:#16a34a; --ok-bg:#e3f6ea; --bad:#dc2626; --bad-bg:#fdeaea;
  --warn:#c98a00; --gold:#d4a017; --chip:#eef0f5; --shadow:0 2px 10px rgba(20,25,40,.07);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12141a; --card:#1c1f28; --ink:#eceef3; --muted:#a2a8b8; --line:#2e3240;
    --accent:#2dd4bf; --accent-ink:#04201d; --ok:#4ade80; --ok-bg:#16301f; --bad:#f87171; --bad-bg:#3a1c1f;
    --warn:#facc15; --gold:#f2c14e; --chip:#262a35; --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{font-weight:800;letter-spacing:.3px;font-size:18px;cursor:pointer}
.logo span{color:var(--accent)}
.spacer{flex:1}
main{max-width:980px;margin:0 auto;padding:16px}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:9px 14px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.ghost{background:transparent}
button.small,.small{font-size:13px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.chip{display:inline-block;background:var(--chip);color:var(--muted);border-radius:999px;padding:2px 10px;font-size:13px}
.chip.hot{background:var(--accent);color:var(--accent-ink)}
.muted{color:var(--muted)}
h1{font-size:24px;margin:8px 0}
h2{font-size:19px;margin:4px 0 8px}
h3{font-size:16px;margin:12px 0 6px}
.bar{height:10px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.week{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.day{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--line);color:var(--muted)}
.day.done{background:var(--ok);border-color:var(--ok);color:#fff}
.day.today{border-color:var(--accent)}
.tile{cursor:pointer;margin:0}
.tile:hover{border-color:var(--accent)}
.tile .big{font-size:28px;font-weight:800}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:8px}
.tabs button{white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;padding:12px 14px}
.opt:disabled{opacity:.55}
.opt.right,.opt.wrong{opacity:1;border-width:2px;font-weight:600}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.right::before{content:"✔ ";color:var(--ok)}
.opt.wrong::before{content:"✘ ";color:var(--bad)}
.opt.multi::before{content:"☐ ";color:var(--muted)}
.opt.multi.sel{border-color:var(--accent);border-width:2px;background:var(--chip)}
.opt.multi.sel::before{content:"☑ ";color:var(--accent)}
.opt.missed{opacity:1;border:2px dashed var(--ok);font-weight:600}
.opt.missed::before{content:"◻ ";color:var(--ok)}
.opt.missed::after{content:"  ← übersehen";color:var(--ok);font-weight:400;font-size:13px}
.feedback{margin-top:12px;padding:12px;border-radius:10px;background:var(--chip)}
.src{margin-top:6px;font-size:12px;color:var(--muted)}
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
.flash .front{font-size:26px;font-weight:800}
.flash .back{font-size:17px;margin-top:10px}
.center{text-align:center}
.huge{font-size:40px;font-weight:800}
.medal svg{width:52px;height:52px;display:block;margin:0 auto 2px}
.medal{width:70px;text-align:center;font-size:11px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
.overlay .card{max-width:360px;width:100%}
.boxes{display:flex;gap:4px;align-items:flex-end;height:40px}
.boxes i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.8}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.amp{display:inline-flex;gap:4px}
.amp button{width:28px;height:28px;padding:0;border-radius:50%;opacity:.35}
.amp button.on{opacity:1;outline:2px solid var(--ink)}
.a-rot{background:#dc2626!important}.a-gelb{background:#eab308!important}.a-gruen{background:#16a34a!important}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.empty{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14px}
a{color:var(--accent)}
.lz{font-size:16px;line-height:1.6}
.lz h3{margin:14px 0 4px;color:var(--accent)}
.lz ul,.lz ol{margin:4px 0;padding-left:22px}
.lz li{margin:3px 0}
details summary{cursor:pointer}
.chip.hot{animation:none}
#timer{font-variant-numeric:tabular-nums}
@media (max-width:480px){ .day{width:30px;height:30px} .flash .front{font-size:22px} main{padding:12px} }
</style>
</head>
<body>
<header>
  <div class="logo" id="logo">Lern<span>-Cockpit</span></div>
  <div class="spacer"></div>
  <button class="ghost small" id="setBtn" title="KI-Feedback einrichten">⚙️</button>
  <button class="ghost small" id="timerBtn" title="20-Minuten-Lernblock">⏱ Satz</button>
  <button class="ghost small" id="playerBtn"></button>
</header>
<main id="app"></main>
<input type="file" id="importFile" accept=".json,application/json" hidden>

  "quelle": "Schulbuch (Westermann/Diercke) S. 289/290 „Der Begriff der Globalisierung“ und „Technische Voraussetzungen“ (Leos Geo-Heft S. 5–6); Beispiele: Dubai Airports 2025, Fraport 2025, MPA Singapore 2025, Schulbuch S. 238",
  "lesen": "<h3>Was ist Globalisierung?</h3><p>Unter Globalisierung versteht man in der Regel die <b>dynamische raum-zeitliche Ausdehnung ökonomischer, sozialer und kultureller Praktiken über staatliche Grenzen</b>. Sie kann zu weltweiter Angleichung führen, aber auch soziale und räumliche <b>Unterschiede verstärken</b>.</p><h3>Technische Voraussetzungen (Schulbuch)</h3><ul><li><b>Seeweg:</b> Rund 90 % der Tonnage im Welthandel werden über See transportiert.</li><li><b>Container</b> (seit Ende der 1950er-Jahre) mit standardisierten Maßen (20- und 40-Fuß nach ISO-Norm): schnell und günstig zwischen Verkehrsträgern umladbar.</li><li><b>Luftverkehr</b> für wertvolle und zeitkritische Waren; <b>Hub-and-Spoke-System</b>: Flugrouten werden an großen Umsteigeflughäfen (Hubs) gebündelt, kleine Flughäfen dienen als Zubringer.</li><li><b>Datenübertragung:</b> geostationäre Satelliten (seit Mitte der 1960er) und Glasfaserkabel unter dem Meer (seit Mitte der 1980er) ermöglichen den weltweiten 24-Stunden-Devisen- und Börsenhandel.</li></ul><h3>Der Zusammenhang mit Global Cities</h3><p>Je stärker die Welt vernetzt ist, desto wichtiger werden die <b>Knotenpunkte</b>, an denen sich Verkehr, Daten, Kapital und Unternehmenszentralen bündeln – genau das sind Global Cities mit ihrer <b>Command-and-Control-Funktion</b>. Beispiele: <b>Dubai</b> als Luftverkehrs-Hub (DXB 2025: 95,2 Mio. Passagiere, 291 Ziele), <b>Frankfurt</b> (in Europa führend bei der Umsteige-Anbindung, dazu der Internetknoten DE-CIX), <b>Singapur</b> als größter Container-Umschlagplatz für Transshipment.</p>",

  "quelle": "Schulbuch (Westermann/Diercke) S. 246/247 „Wo bin ich eigentlich? – Placelessness als Indikator für Globalisierungsprozesse“ (Leos Geo-Heft S. 10–11)",
  "lesen": "<h3>Place</h3><p>Ein <b>Place</b> ist ein Ort, der sich aufgrund seiner <b>Einzigartigkeit (Identität)</b> von anderen Orten unterscheidet – nicht nur im Aussehen, sondern auch darin, wie er wahrgenommen wird und welche Erfahrungen er bietet.</p><h3>Placelessness</h3><p><b>Placelessness</b> bedeutet „Ortslosigkeit“: Orte, deren individuelle Identität durch <b>Vereinheitlichung und Standardisierung</b> geschwächt ist. Zugespitzt sehen sie für verschiedene Menschen nicht nur gleich aus, sondern bieten auch die gleichen Erfahrungen. Beispiel im Schulbuch: McDonald's-Filialen in den Global Cities <b>New York und Hongkong</b>, die kaum zu unterscheiden sind; besonders ausgeprägt in massentouristischen Hochburgen.</p><h3>Wichtig</h3><ul><li>Orte haben immer <b>Merkmale beider Begriffe</b> – sie stehen sich nicht als Gegensatz gegenüber, sondern müssen <b>relational</b> betrachtet werden.</li><li>Der <b>Sense of Place</b> ist individuell: Er hängt von Interessen, Erfahrungen und Werten des Einzelnen ab (Beispiel Weltreisende Kaysa: identische Filialen, aber jedes Mal andere Erfahrungen durch Kollegen und Kunden).</li></ul><h3>Vor- und Nachteile (Unterricht)</h3><ul><li><b>Vorteile:</b> Standardisierung ermöglicht schneller und einfacher weite Erfahrungsmöglichkeiten; Heimatgefühle auch außerhalb der Heimat (vertrautes Essen, Sprache, Kultur); höhere Flexibilität bei beruflichen Chancen.</li><li><b>Nachteile:</b> Identitätsverlust eines Ortes (v. a. für Einheimische); „Mainstream“-Charakter; Verlust der Attraktivität; kultureller Verlust; Ersetzbarkeit von Orten; Standardisierung fördert Massentourismus und „Overtourism“.</li></ul><p class='small muted'>Heft S. 30–31</p>",

  "lesen": "<h3>Definition (Unterricht)</h3><p>Unter Globalisierung kann man das <b>„Zusammenwachsen der Welt“ auf räumlicher und zeitlicher Ebene</b> verstehen. Sie findet mittlerweile in allen Bereichen des Lebens statt.</p><p class='small'>Schulbuch: die dynamische raum-zeitliche Ausdehnung ökonomischer, sozialer und kultureller Praktiken über staatliche Grenzen – sie kann angleichen, aber auch Unterschiede verstärken.</p><h3>Dimensionen (= Lebensbereiche, die betroffen sind)</h3><ul><li><b>Wirtschaft:</b> Fusionen, internationale Arbeitsteilung, grenzüberschreitender Kapitalverkehr, internationale Finanzmärkte, Standortwettbewerb, Direktinvestitionen, transnationale Konzerne</li><li><b>Politik:</b> internationale Organisationen, regionale Abkommen, Global Governance</li><li><b>Gesellschaft:</b> Wissensgesellschaft, Wertewandel, Aufhebung räumlicher und zeitlicher Distanz, Tourismus</li><li><b>Kultur:</b> internationale Mode, Küche, Musik, Filme; „Anglisierung“ der Sprachen</li><li><b>Kommunikation:</b> Informationsfreiheit, Internet, Telefon, Logistik</li><li><b>Arbeit:</b> weltweites Angebot, Migration, Mobilität, Freizügigkeit</li><li><b>Umwelt:</b> Klimawandel, Ressourcenknappheit, Artensterben, Megastädte</li></ul><h3>Triebkräfte (Tabelle aus dem Unterricht)</h3><ul><li>Steigende Transportkapazität und moderne Transportlogistik, insbesondere <b>Containerschiffe</b> → Wirtschaft</li><li>Innovationen der Informations- und Kommunikationstechnologie, insbesondere das <b>Internet</b> → Kommunikation</li><li><b>Außenwirtschaftliche Liberalisierung</b> und staatlich gelenkte Vergünstigungen als Standortfaktor → Wirtschaft, Politik</li></ul><h3>Beispiel: ein iPhone geht um die Welt</h3><p>Viele Länder sind an einem Produkt beteiligt – entlang der Kette <b>Rohstoffe → Bauteile → Fertigung → Transport → Vertrieb → Verkauf</b>.</p>",

  "lesen": "<h3>Die Triade</h3><p>Fast alle Länder sind in die weltweiten Waren- und Kapitalströme eingebunden, <b>profitieren aber nicht in gleichem Maß</b>. Ein Großteil des Handels konzentriert sich auf die <b>Triade</b>: <b>EU, Nordamerika sowie Ost- und Südostasien</b> (Japan, Südkorea, inzwischen China und Teile Südostasiens). Innerhalb der Triade werden <b>mehr als vier Fünftel</b> des gesamten Handels mit Waren und Dienstleistungen abgewickelt. Auch die Kapital- und Finanzströme – vor allem die Abflüsse von Direktinvestitionen – konzentrieren sich auf die Kernländer der Triade.</p><h3>Größte Exporteure 2021 (Anteil an den weltweiten Exporten, WTO 2022)</h3><ul><li><b>Waren:</b> China 15,1 % („Fabrik der Welt“), USA 7,9 %, Deutschland 7,3 %, Niederlande 3,8 %, Japan 3,4 %</li><li><b>Dienstleistungen:</b> USA 12,6 %, Großbritannien 7,0 %, China 6,6 %, dann Deutschland</li></ul><h3>Regionalisierung</h3><p>Obwohl die Welt „zusammenwächst“, gibt es einen gegenteiligen Trend: den Zusammenschluss zu wirtschaftlichen und/oder politischen Blöcken wie <b>EU, NAFTA, ASEAN</b>.</p><h3>Bezug zu Global Cities</h3><p>Die wichtigsten Global Cities liegen in der Triade – z. B. London, New York, Tokio, Paris, Singapur (GaWC 2024).</p>",

  "lesen": "<h3>Sorgen und Widerstand</h3><ul><li>Freihandelsabkommen werden von vielen Menschen mit Sorge betrachtet: Sie befürchten den <b>Abbau von Arbeitnehmerrechten</b> und Einschnitte beim <b>Verbraucherschutz</b> sowie bei <b>Sozial- und Umweltstandards</b>.</li><li>Der Widerstand wird zunehmend international organisiert – Gruppen wie <b>ATTAC</b> sind damit selbst ein Ausdruck der Globalisierung.</li></ul><h3>Verwundbarkeit des Welthandels</h3><ul><li>Die <b>Covid-19-Pandemie</b>, der <b>russische Angriff auf die Ukraine</b> und die folgenden <b>Handelssanktionen</b> haben gezeigt, wie verwundbar das Welthandelssystem und seine gegenseitigen Abhängigkeiten sind.</li><li>Die <b>Risiken komplexer Lieferketten</b> und die großen <b>Abhängigkeiten</b> von Ländern wie Deutschland bei Roh- und Energiestoffen wurden lange unterschätzt.</li><li>Insgesamt wird Globalisierung heute <b>kritischer gesehen</b> als noch vor wenigen Jahren.</li></ul><h3>Bezug zu Global Cities</h3><p>Global Cities sind die Knoten dieses Systems – Störungen treffen sie besonders (z. B. New York nach der Pandemie: nur ca. 10 % der Angestellten zurück im Büro).</p>",

  "lesen": "<h3>Was ist eine Funktionsschar?</h3><p>Ein Funktionsterm mit einem zusätzlichen <b>Parameter</b> (z. B. a, k, t). Für jeden Parameterwert entsteht eine eigene Funktion – zusammen bilden sie die <b>Schar</b>. Beim Rechnen behandelst du den Parameter <b>wie eine feste Zahl</b>.</p><h3>Nullstellen</h3><ul><li><b>x ausklammern</b>, wenn kein Absolutglied da ist: x² + 2ax = x·(x + 2a).</li><li><b>Satz vom Nullprodukt:</b> Ein Produkt ist 0, wenn ein Faktor 0 ist.</li><li>Sonst <b>pq-Formel</b> mit Parameter – die Diskriminante entscheidet über die Anzahl.</li></ul><h3>Fallunterscheidung</h3><p>Die Anzahl der Nullstellen kann vom Parameter abhängen: Diskriminante &gt; 0 → zwei, = 0 → eine (doppelt, Berührpunkt), &lt; 0 → keine. Bei <b>Division durch den Parameter</b> immer prüfen, ob er 0 sein darf.</p><h3>Gemeinsame Punkte</h3><p>Punkte, durch die <b>alle</b> Graphen gehen: zwei Scharfunktionen gleichsetzen (f<sub>a</sub>(x) = f<sub>b</sub>(x), a ≠ b) oder den Parameter-Teil = 0 setzen.</p>",

  "lesen": "<h3>Ablauf (wie ohne Parameter)</h3><ol><li>f′, f″ (und ggf. f‴) bilden – der Parameter bleibt stehen.</li><li><b>Notwendige Bedingung:</b> f′(x) = 0 nach x auflösen → x hängt vom Parameter ab (z. B. x = t).</li><li><b>Hinreichende Bedingung:</b> f″(x<sub>E</sub>) einsetzen. &lt; 0 → Hochpunkt, &gt; 0 → Tiefpunkt. Vorzeichen hängt oft vom Parameter ab → Voraussetzung (z. B. t &gt; 0) nutzen!</li><li><b>y-Wert</b> mit f (nicht f′!) berechnen → Punkt wie H(t | 4t³).</li></ol><h3>Wendepunkte</h3><p>f″(x) = 0 und f‴(x) ≠ 0. Steigung der Wendetangente: f′(x<sub>W</sub>).</p><h3>Typische Fehler</h3><ul><li>y-Wert in f′ statt f eingesetzt.</li><li>Art des Extrempunkts nicht begründet.</li><li>Voraussetzung t &gt; 0 nicht genutzt.</li></ul>",

<script>
(function(){
"use strict";
const CONFIG = JSON.parse(document.getElementById('config').textContent);
const DECKS  = JSON.parse(document.getElementById('decks').textContent);
const PLAYERS = Object.keys(CONFIG);
const INTERVALS=[0,1,3,7,14,30], SESSION_CARDS=15, QUIZ_LEN=12, CHALLENGE_LEN=15, CHALLENGE_PASS=0.8, WEEK_GOAL=4, CHECK_LEN=10, MIX_LEN=20;
// Richtig/Falsch-Aussagen ("tf") werden zu normalen Quizfragen mit fester Reihenfolge
DECKS.forEach(d=>{ (d.tf||[]).forEach(t=>{ d.items=d.items||[];
  d.items.push({id:t.id,frage:'Richtig oder falsch? „'+t.aussage+'“',antworten:['Richtig','Falsch'],richtig:t.wahr?0:1,erklaerung:t.erklaerung,fix:true}); }); });
const EINHEITEN = JSON.parse(document.getElementById('einheiten').textContent);
const KLAUSUREN = JSON.parse(document.getElementById('klausuren').textContent);
const ARTEN=['Klausur','Test','Mündlich','Halbjahr'];
const $app=document.getElementById('app');

const store={
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
};
let player=store.get('lerncockpit:last'); if(!PLAYERS.includes(player)) player=null;
let S=null;

/* ---------- Hilfen ---------- */
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>fmt(new Date());
const addDays=n=>{ const d=new Date(); d.setDate(d.getDate()+n); return fmt(d); };
const daysUntil=s=>{ const a=new Date(today()+'T00:00'), b=new Date(s+'T00:00'); return Math.round((b-a)/864e5); };
const de=s=>{ if(!s) return ''; const [y,m,d]=s.split('-'); return `${d}.${m}.${y}`; };
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const uid=()=>Math.random().toString(36).slice(2,9);

function load(){
  // Übernahme aus der früheren Lern-Arena (gleicher Browser)
  S=store.get('lerncockpit:v1:'+player) || store.get('lernarena:v1:'+player) || {};
  S.leitner=S.leitner||{}; S.history=S.history||[]; S.orden=S.orden||{}; S.days=S.days||[];
  S.fach=S.fach||{}; S.termine=S.termine||[]; S.extraFaecher=S.extraFaecher||[]; S.hiddenTermine=S.hiddenTermine||[]; S.checks=S.checks||[];
  seedFromConfig();
}
function save(){ if(player) store.set('lerncockpit:v1:'+player,S); }
function markDay(){ const t=today(); if(!S.days.includes(t)) S.days.push(t); }

/* ---------- Daten zusammenführen (Konfiguration + eigene Einträge) ---------- */
function cfg(){ return CONFIG[player]; }
function faecher(){ return cfg().faecher.concat(S.extraFaecher); }
function fachById(id){ return faecher().find(f=>f.id===id); }
function F(id){ S.fach[id]=S.fach[id]||{noten:[],themen:[],done:{}}; const f=S.fach[id]; f.noten=f.noten||[]; f.themen=f.themen||[]; f.done=f.done||{}; return f; }
/* Startdaten aus der Konfiguration übernehmen (von Claude gepflegt, "start" je Fach).
   Ergänzt nur: vorhandene eigene Einträge werden nie überschrieben. Neue "startVersion" → erneuter Abgleich. */
function seedFromConfig(){
  S.seeded=S.seeded||{};
  cfg().faecher.forEach(f=>{
    const st=f.start; if(!st) return;
    const ver=st.version||1; if((S.seeded[f.id]||0)>=ver) return;
    const d=F(f.id);
    ['thema','staerken','luecken','pruefung'].forEach(k=>{ if(st[k]&&!d[k]) d[k]=st[k]; });
    Object.entries(st.umbenennen||{}).forEach(([alt,neu])=>{ d.themen.forEach(t=>{ if(t.name===alt) t.name=neu; }); });   // Ampelfarbe bleibt
    (st.entfernen||[]).forEach(name=>{ d.themen=d.themen.filter(t=>!(t.name===name&&t.ampel==='gelb')); });  // nur unveränderte Startthemen
    (st.noten||[]).forEach(n=>{ if(!d.noten.some(x=>x.datum===n.datum&&x.art===n.art)) d.noten.push(Object.assign({id:uid(),notiz:''},n)); });
    (st.themen||[]).forEach(t=>{ const name=typeof t==='string'?t:t.name, amp=(typeof t==='object'&&t.ampel)||'gelb';
      const ex=d.themen.find(x=>x.name===name); if(!ex) d.themen.push({id:uid(),name,ampel:amp}); });
    S.seeded[f.id]=ver;
  });
  save();
}
function niveau(id){ return F(id).niveau || (fachById(id)||{}).niveau || ''; }
function pruefung(id){ return F(id).pruefung || (fachById(id)||{}).pruefung || ''; }
function termine(fid){
  const all=cfg().termine.filter(t=>!S.hiddenTermine.includes(t.id)).concat(S.termine);
  return all.filter(t=>(!fid||t.fach===fid) && daysUntil(t.datum)>=0).sort((a,b)=>a.datum.localeCompare(b.datum));
}
function decksFor(fid){   // nur Decks passend zum eigenen Kursniveau (unbekanntes Niveau → alle)
  const nv=niveau(fid).replace(/\s*\(V\)/,'').trim();
  return DECKS.filter(d=>d.fachId===fid && (!nv||!d.niveau||d.niveau.split('/').includes(nv)));
}
function myDecks(){ return faecher().flatMap(f=>decksFor(f.id)); }
function material(fid){ return (cfg().material||{})[fid]||[]; }
function lastNote(fid){ const n=F(fid).noten.slice().sort((a,b)=>a.datum.localeCompare(b.datum)); return n[n.length-1]; }
function trend(fid){ const n=F(fid).noten.filter(x=>x.art==='Klausur'||x.art==='Test').sort((a,b)=>a.datum.localeCompare(b.datum)); if(n.length<2) return ''; const d=n[n.length-1].punkte-n[n.length-2].punkte; return d>0?'↗':d<0?'↘':'→'; }

/* ---------- Lernkarten-Logik ---------- */
function allCards(deck){
  const out=[];
  (deck.cards||[]).forEach(c=>out.push({key:deck.id+':'+c.id,front:c.front,back:c.back,extra:c.extra||''}));
  (deck.items||[]).forEach(it=>out.push({key:deck.id+':'+it.id,front:it.frage,back:it.richtige?it.richtige.map(i=>it.antworten[i]).join(' · '):it.antworten[it.richtig],extra:it.erklaerung||''}));
  return out;
}
function dueCards(deck){
  const t=today(), all=allCards(deck);
  const due=all.filter(c=>S.leitner[c.key]&&S.leitner[c.key].due<=t), fresh=all.filter(c=>!S.leitner[c.key]);
  return shuffle(due).concat(shuffle(fresh)).slice(0,SESSION_CARDS);
}
function mastery(deck){ const all=allCards(deck); return all.length? all.filter(c=>(S.leitner[c.key]||{}).box>=3).length/all.length : 0; }
function fachMastery(fid){ const ds=decksFor(fid); if(!ds.length) return null; const all=ds.flatMap(allCards); return all.filter(c=>(S.leitner[c.key]||{}).box>=3).length/all.length; }
function buildQuiz(deckOrDecks,n){   // ein Deck oder mehrere (Fach-Mix = verschachteltes Üben)
  const decks=Array.isArray(deckOrDecks)?deckOrDecks:(deckOrDecks.decks||[deckOrDecks]), pool=[];
  decks.forEach(deck=>{
    const cards=deck.cards||[];
    cards.forEach(c=>{
      const others=shuffle(cards.filter(o=>o.id!==c.id)).slice(0,3); if(others.length<3) return;
      const ex=c.front+': '+c.back+(c.extra?' '+c.extra:'');
      pool.push({key:deck.id+':'+c.id,prompt:'Welcher Begriff passt zu dieser Beschreibung?',body:c.back,options:[c.front].concat(others.map(o=>o.front)),explain:ex,source:deck.quelle});
      pool.push({key:deck.id+':'+c.id,prompt:'Was bedeutet „'+c.front+'“?',body:'',options:[c.back].concat(others.map(o=>o.back)),explain:ex,source:deck.quelle});
    });
    (deck.items||[]).forEach(it=>pool.push(it.richtige?{key:deck.id+':'+it.id,prompt:it.frage,body:'',options:it.antworten.slice(),correctTexts:it.richtige.map(i=>it.antworten[i]),multi:true,explain:it.erklaerung,source:deck.quelle}
      :{key:deck.id+':'+it.id,prompt:it.frage,body:'',options:it.antworten.slice(),correctText:it.antworten[it.richtig],explain:it.erklaerung,fix:it.fix,source:deck.quelle}));
  });
  const only=deckOrDecks.onlyKeys, fid=(decks[0]||{}).fachId;
  const cand=shuffle(only?pool.filter(q=>only.includes(q.key)):pool);
  const weak=cand.filter(q=>isWeak(q,fid)), rest=cand.filter(q=>!isWeak(q,fid));
  const ordered=weak.slice(0,Math.ceil(n*0.5)).concat(rest,weak.slice(Math.ceil(n*0.5)));   // bis zur Hälfte Schwachstellen
  const seen=new Set(), qs=[];
  ordered.forEach(q=>{ if(!seen.has(q.key)&&qs.length<n){ seen.add(q.key); qs.push(q); } });
  qs.splice(0,qs.length,...shuffle(qs));
  return qs.map(q=>{ const opts=q.fix?q.options:shuffle(q.options);
    if(q.multi) return Object.assign({},q,{options:opts,correct:-99,correctSet:q.correctTexts.map(t=>opts.indexOf(t))});
    const correct=q.correctText??q.options[0]; return Object.assign({},q,{options:opts,correct:opts.indexOf(correct)}); });
}
const isRight=(q,a)=>q.multi?(Array.isArray(a)&&a.length===q.correctSet.length&&q.correctSet.every(x=>a.includes(x))):a===q.correct;
const correctText=q=>q.multi?q.correctSet.map(k=>q.options[k]).join(' · '):q.options[q.correct];
function multiOpts(q){ return `<p class="small muted" style="margin:4px 0 0">☑ Eine oder mehrere Antworten können richtig sein – wähle alle richtigen aus.</p>
  <div class="opts">${q.options.map((o,k)=>`<button class="opt multi" data-k="${k}">${esc(o)}</button>`).join('')}</div>`; }
function bindMulti(onReady){ const btns=[...$app.querySelectorAll('.opt.multi')];
  btns.forEach(b=>b.onclick=()=>{ b.classList.toggle('sel'); onReady(btns.filter(x=>x.classList.contains('sel')).map(x=>+x.dataset.k)); }); }

function countdownChip(t){ const d=daysUntil(t.datum); return `<span class="chip ${d<=3?'hot':''}">${d===0?'heute':d===1?'morgen':'in '+d+' Tagen'}</span>`; }
function notenChart(noten){
  const n=noten.slice().sort((a,b)=>a.datum.localeCompare(b.datum));
  if(n.length<2) return `<div class="empty">Ab zwei eingetragenen Noten erscheint hier dein Verlauf.</div>`;
  const W=600,H=180,p=28, x=i=>p+i*(W-2*p)/(n.length-1), y=v=>H-p-(v/15)*(H-2*p);
  const grid=[0,5,10,15].map(v=>`<line x1="${p}" x2="${W-p}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="4" y="${y(v)+4}" font-size="11" fill="var(--muted)">${v}</text>`).join('');
  const pts=n.map((e,i)=>`${x(i)},${y(e.punkte)}`).join(' ');

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Notenverlauf">${grid}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${dots}</svg>`;

/* ---------- Tagesplan (ca. 60 Min., R-003) ---------- */
function dailyPlan(){
  const plan=[], soon=termine().find(t=>t.typ!=='erinnerung'&&daysUntil(t.datum)<=14), prio=soon?fachById(soon.fach):null;
  const fFid=(prio&&fokusKeys(prio.id).length)?prio.id:(faecher().find(f=>fokusKeys(f.id).length)||{}).id;
  if(fFid) plan.push({min:10,icon:'🎯',title:`Fokus-Training: ${openFokus(fFid).length} Baustelle(n)`,sub:`${fachById(fFid).name} · gezielt deine Schwachstellen`,act:{type:'fokus',fid:fFid}});
  // 1) fällige Lernkarten
  const duePool=prio&&decksFor(prio.id).some(d=>dueCards(d).length)?decksFor(prio.id):myDecks();   // vor einer Klausur: deren Fach zuerst
  const withDue=duePool.map(d=>({d,n:dueCards(d).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n)[0];
  if(withDue) plan.push({min:10,icon:'🃏',title:`Lernkarten wiederholen (${withDue.n})`,sub:withDue.d.titel,act:{type:'cards',deck:withDue.d.id}});
  // 2) Schwerpunkt: nächste Klausur bzw. rote Themen
  const fWithRed=faecher().map(f=>({f,red:F(f.id).themen.filter(t=>t.ampel==='rot')})).filter(x=>x.red.length);
  const focus=prio?{f:prio,red:F(prio.id).themen.filter(t=>t.ampel==='rot')}:fWithRed[0];
  if(focus&&focus.red.length) plan.push({min:20,icon:'🧱',title:`Baustelle: ${focus.red[0].name}`,sub:`${focus.f.name} · klassisch lernen (lesen → zuklappen → aufschreiben)`,act:{type:'tab',fid:focus.f.id,tab:'klassisch'}});
  else if(prio) plan.push({min:20,icon:'📚',title:`Vorbereitung: ${soon.titel}`,sub:`${prio.name} · Unterlagen & Lernplan`,act:{type:'tab',fid:prio.id,tab:'klassisch'}});
  // 3) aktives Abrufen: Quiz im schwächsten Deck
  const weakPool=prio&&decksFor(prio.id).length?decksFor(prio.id):myDecks();   // vor einer Klausur: deren Fach zuerst
  const weak=weakPool.slice().sort((a,b)=>mastery(a)-mastery(b))[0];
  if(weak) plan.push({min:20,icon:'🎯',title:'Quiz-Runde',sub:weak.titel,act:{type:'quiz',deck:weak.id}});
  // 4) fehlende Standortbestimmung
  const noStand=faecher().find(f=>!F(f.id).noten.length||!niveau(f.id));
  if(noStand&&plan.length<4) plan.push({min:5,icon:'🧭',title:`Stand eintragen: ${noStand.name}`,sub:'Niveau, Noten, aktuelles Thema – damit Claude passende Aufgaben baut',act:{type:'tab',fid:noStand.id,tab:'stand'}});
  // 5) Abschluss
  plan.push({min:5,icon:'🚦',title:'Abschluss: Was sitzt, was wackelt?',sub:'Themen-Ampel kurz aktualisieren',act:{type:'tab',fid:(prio||faecher()[0]).id,tab:'stand'}});
  return plan;
}
function runAct(a){
  if(a.type==='cards') startCards(DECKS.find(d=>d.id===a.deck));
  if(a.type==='quiz') startQuiz(DECKS.find(d=>d.id===a.deck),QUIZ_LEN,false);
  if(a.type==='tab') go({name:'fach',fid:a.fid,tab:a.tab});
  if(a.type==='fokus') startFokus(a.fid);
}

function tabUeberblick(f){

     ${fd.themen.length?fd.themen.map(t=>{ const w=themaWissen(f.id,t.name); return `<div class="row between" style="padding:5px 0;border-bottom:1px solid var(--line)"><span>${esc(t.name)}</span><span>${w?wissenHtml(w):`<span class="small muted">noch nicht geübt · Selbsteinschätzung </span><span class="dot ${AMP_CLS[t.ampel]}"></span>`}</span></div>`; }).join(''):'<div class="empty">Noch keine Themen.</div>'}
   </div>

   <div class="card"><h3>Baustellen (Ampel rot)</h3>${red.length?red.map(t=>`<div><span class="dot a-rot"></span>${esc(t.name)}</div>`).join(''):'<span class="muted small">Keine roten Themen eingetragen.</span>'}</div>`;
}

  AFTER.quiz=()=>{ bind('[data-a]',b=>{ const d=b.dataset.d==='mix'?mixDeck:DECKS.find(x=>x.id===b.dataset.d);
    if(b.dataset.a==='cards') startCards(d); if(b.dataset.a==='quiz') startQuiz(d,QUIZ_LEN,false); if(b.dataset.a==='challenge') startQuiz(d,CHALLENGE_LEN,true);
    if(b.dataset.a==='check') startCheck(d); if(b.dataset.a==='mix') startQuiz(d,MIX_LEN,false); });
    bindFokus(); };   // Fokus-Knopf erst binden, wenn der Tab im DOM steht
  if(!ds.length) return `<div class="card"><div class="empty">Noch keine Quiz- und Lernkarten für ${esc(f.name)}. Sobald Unterlagen (Scans, Stark-Heft) da sind, erstellt Claude hier Inhalte – nur aus belegten Quellen.</div></div>`;

        <button data-a="check" data-d="${d.id}" title="Selbsteinschätzung vs. Ergebnis">🧭 ${S.checks.some(c=>c.deck===d.id)?'Check wiederholen':'Einstiegs-Check'}</button></div>
      <p class="src">Quelle: ${esc(d.quelle)}</p></div>`; }).join('');
}

/* ---------- Probeklausuren ---------- */
function tabProbeklausur(f){
  const ks=KLAUSUREN.filter(k=>k.fachId===f.id); S.pk=S.pk||{};
  AFTER.probeklausur=()=>{ bind('[data-k]',b=>startKlausur(KLAUSUREN.find(k=>k.id===b.dataset.k),b.dataset.neu==='1'));
    bind('[data-kb]',b=>{ const k=KLAUSUREN.find(x=>x.id===b.dataset.kb); korrekturbogen(k,S.pk[k.id].results.length-1); }); };
  if(!ks.length) return `<div class="card"><h2>📝 Probeklausuren</h2><div class="empty">Für ${esc(f.name)} gibt es noch keine Probeklausur. Sobald Unterlagen (Klausuren, Stark-Heft, Arbeitsblätter) da sind, erstellt Claude hier Probeklausuren im Stil eures Unterrichts.</div></div>`;
  return ks.map(k=>{ const st=S.pk[k.id]||{}, rs=st.results||[], last=rs[rs.length-1], be=k.aufgaben.reduce((s,a)=>s+a.be,0), hasDraft=st.draft&&Object.values(st.draft).some(Boolean);
    return `<div class="card"><div class="row between"><h2>📝 ${esc(k.titel)}</h2><span class="chip">${k.dauer} Min. · ${be} BE</span></div>
      <p class="small muted" style="margin:0 0 8px">${esc(k.hinweis)}</p>
      <ol style="margin:0 0 8px;padding-left:20px">${k.aufgaben.map(a=>`<li><b>${esc(a.operator)}</b> (${a.be} BE): ${esc(a.text)}</li>`).join('')}</ol>
      ${rs.length?`<p class="small">Ergebnisse: ${rs.map(r=>`<span class="dot ${AMP_CLS[ampelFromPunkte(r.punkte)]}"></span>${de(r.date)}: ${r.be}/${r.max} BE = ${r.punkte} P. (${NOTEN[r.punkte]})`).join(' · ')}</p>`:''}
      <div class="row"><button class="primary" data-k="${k.id}" data-neu="${hasDraft?'0':'1'}">${hasDraft?'▶ Weiterschreiben':rs.length?'🔁 Nochmal schreiben':'▶ Klausur starten'}</button>
      ${hasDraft?`<button data-k="${k.id}" data-neu="1">Neu beginnen</button>`:''}
      ${rs.length?`<button data-kb="${k.id}">📋 Korrekturbogen (${de(last.date)})</button>`:''}</div>
      <p class="src">Material: ${esc(k.quelle)}</p></div>`; }).join('')+
    `<div class="card"><h3>So funktioniert's</h3><ol style="margin:0;padding-left:20px"><li>Unter echten Bedingungen schreiben: Timer läuft, Material aufklappen, Atlas bereitlegen.</li><li>Abgeben → Erwartungshorizont: Die App hakt erkannte Punkte vor, du prüfst ehrlich nach.</li><li>Ergebnis in BE, Punkten und Note – fehlende Punkte werden zu 🎯 Baustellen.</li><li>Optional: die ganze Klausur an Claude schicken → Lernstand-Code zurück in die App.</li></ol></div>`;
}
function startKlausur(k,neu){
  view={name:'fach',fid:k.fachId,tab:'probeklausur'}; S.pk=S.pk||{}; const st=S.pk[k.id]=S.pk[k.id]||{};
  if(neu||!st.draft){ st.draft={}; st.start=Date.now(); } save();
  const total=k.aufgaben.reduce((s,a)=>s+a.be,0);
  const back=()=>{ clearInterval(eTimer); save(); go({name:'fach',fid:k.fachId,tab:'probeklausur'}); };
  $app.innerHTML=`<div class="row between"><button class="ghost small" id="b">← Pausieren</button><span class="row"><span class="chip">📝 ${esc(k.titel)}</span><span class="chip" id="kt"></span></span></div>
    <div class="card"><p class="small muted" style="margin:0">${esc(k.hinweis)} · ${total} BE · Entwürfe werden automatisch gespeichert.</p></div>
    <div class="card"><h2>Material</h2>${k.material.map((m,i)=>`<details style="margin:6px 0" ${i===0?'open':''}><summary><b>${esc(m.titel)}</b></summary><div class="lz" style="margin-top:6px">${m.html}</div></details>`).join('')}</div>
    ${k.aufgaben.map(a=>`<div class="card"><div class="row between"><h2 style="margin:0">Aufgabe ${a.nr}</h2><span class="chip">${esc(a.operator)} · ${a.be} BE · ca. ${a.zeit} Min.</span></div>
      <p style="font-size:17px">${esc(a.text)}</p><textarea data-a="${a.nr}" style="min-height:${a.be>=15?320:220}px" placeholder="Deine Lösung zu Aufgabe ${a.nr} …">${esc(st.draft[a.nr]||'')}</textarea></div>`).join('')}
    <div class="card center"><button class="primary" id="abg">✔ Klausur abgeben</button></div>`;
  let t=null; $app.querySelectorAll('textarea[data-a]').forEach(ta=>ta.oninput=()=>{ st.draft[ta.dataset.a]=ta.value; clearTimeout(t); t=setTimeout(save,800); });
  document.getElementById('b').onclick=back;
  const end=(st.start||Date.now())+k.dauer*60000;
  clearInterval(eTimer); const upd=()=>{ const el=document.getElementById('kt'); if(!el){ clearInterval(eTimer); return; } const left=Math.round((end-Date.now())/1000);
    el.textContent=left>0?'⏱ '+tFmt(left):'⏱ Zeit um (+'+tFmt(-left)+')'; el.classList.toggle('hot',left<600); };
  upd(); eTimer=setInterval(upd,1000);
  document.getElementById('abg').onclick=()=>{ const leer=k.aufgaben.filter(a=>!(st.draft[a.nr]||'').trim()).length;
    if(leer&&!confirm(`${leer} Aufgabe(n) sind noch leer. Trotzdem abgeben?`)) return; clearInterval(eTimer); save(); bewertung(k); };
}
function bewertung(k){
  const st=S.pk[k.id], fName=(fachById(k.fachId)||{}).name;
  const checks={}; k.aufgaben.forEach(a=>{ const t=norm(st.draft[a.nr]||''); checks[a.nr]=a.erwartung.map(e=>{ const hits=e.stichworte.filter(w=>t.includes(norm(w))).length;
    return hits>=(e.be>=2&&e.stichworte.length>=3?2:1); }); });   // strenger: größere Punkte brauchen 2 Treffer
  const copyAll=`Hallo Claude, ich bin ${player}. Bitte korrigiere meine Probeklausur „${k.titel}“ (${fName}, ${niveau(k.fachId)||''}) wie eine Lehrkraft: pro Aufgabe Gut / Fehlt / Ungenau und erreichte BE.\n\n`+
    k.aufgaben.map(a=>`AUFGABE ${a.nr} (${a.operator}, ${a.be} BE): ${a.text}\nERWARTUNGSHORIZONT:\n${a.erwartung.map((e,i)=>`  ${i+1}. ${e.text} (${e.be} BE)`).join('\n')}\nMEINE LÖSUNG:\n${st.draft[a.nr]||'(leer)'}`).join('\n\n')+
    `\n\nBitte schließe mit einem Block ab, den ich in meine Lern-App übernehmen kann – genau in diesem Format:\nLERNSTAND-UPDATE\n{"spieler":"${player}","fach":"${k.fachId}","klausur":"${k.id}","erwartung":{${k.aufgaben.map(a=>`"${a.nr}":[${a.erwartung.map(()=>'<BE>').join(',')}]`).join(',')}},"kommentare":{"1":{"1":"kurzer Hinweis zu Punkt 1"}},"staerken":["…"],"fokus":[{"begriff":"…","stichworte":["wortanfang"]}]}\n(erwartung = erreichte BE je Punkt des Erwartungshorizonts in derselben Reihenfolge; kommentare optional, Punktnummern ab 1)`;
  $app.innerHTML=`<div class="row between"><button class="ghost small" id="b">← Zurück</button><span class="chip">📝 Auswertung</span></div>
    <div class="card"><h2>Erwartungshorizont</h2><p class="small muted" style="margin-top:0">Die App hat Punkte vorgehakt, die sie in deinem Text erkannt hat (Stichwort-Prüfung). <b>Prüf ehrlich nach</b> und korrigiere die Haken – nur was wirklich richtig und erklärt ist, zählt.</p>
      <div class="row"><button id="cpall">📋 Ganze Klausur an Claude schicken (kopieren)</button></div></div>
    ${k.aufgaben.map(a=>`<div class="card"><div class="row between"><h2 style="margin:0">Aufgabe ${a.nr} · ${esc(a.operator)}</h2><span class="chip" id="sum${a.nr}"></span></div>
      <details style="margin:8px 0"><summary><b>Deine Lösung</b></summary><p style="white-space:pre-wrap">${esc(st.draft[a.nr]||'(leer)')}</p></details>
      ${a.erwartung.map((e,i)=>`<label style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer"><input type="checkbox" data-c="${a.nr}-${i}" ${checks[a.nr][i]?'checked':''}><span>${esc(e.text)} <span class="chip">${e.be} BE</span></span></label>`).join('')}
      <details style="margin-top:8px"><summary><b>Musterlösung</b></summary><div class="lz">${a.loesung}</div></details>
      <div id="ai${a.nr}" style="margin-top:8px"></div>${apiKey()?`<button class="small" data-ai="${a.nr}">🤖 Aufgabe ${a.nr} von Claude bewerten lassen</button>`:''}</div>`).join('')}
    <div class="card center"><h2 id="gsum"></h2><button class="primary" id="fin">Ergebnis speichern</button></div>`;
  const calc=()=>{ let g=0; k.aufgaben.forEach(a=>{ const e=a.erwartung.reduce((s,x,i)=>s+(document.querySelector(`[data-c="${a.nr}-${i}"]`).checked?x.be:0),0); g+=e; document.getElementById('sum'+a.nr).textContent=`${e}/${a.be} BE`; });
    const mx=k.aufgaben.reduce((s,a)=>s+a.be,0), pk=pctToPunkte(g/mx); document.getElementById('gsum').innerHTML=`${g}/${mx} BE → <span class="dot ${AMP_CLS[ampelFromPunkte(pk)]}"></span>${pk} Punkte (Note ${NOTEN[pk]})`; return {g,mx,pk}; };
  $app.querySelectorAll('[data-c]').forEach(c=>c.onchange=calc); calc();
  document.getElementById('b').onclick=()=>go({name:'fach',fid:k.fachId,tab:'probeklausur'});
  document.getElementById('cpall').onclick=ev=>copyText(copyAll,ev.target);
  bind('[data-ai]',b=>{ const a=k.aufgaben.find(x=>x.nr==b.dataset.ai);
    const sys=`Du bist eine erfahrene Lehrkraft (Oberstufe, Schleswig-Holstein, Fach ${fName}, Niveau ${niveau(k.fachId)||'unbekannt'}). Bewerte die Klausurlösung zu einer Aufgabe anhand des Erwartungshorizonts und der Musterlösung; achte auf den Operator. Keine neuen Fakten hinzufügen. Deutsch, du-Form, max. 180 Wörter, Abschnitte **Gut:**, **Fehlt:**, **Ungenau oder falsch:**. Vorletzte Zeile exakt: FOKUS: <fehlende Fachbegriffe mit Semikolon oder ->. Letzte Zeile exakt: PUNKTE: <erreichte BE>/${a.be}`;
    const usr=`AUFGABE (${a.operator}, ${a.be} BE): ${a.text}\nERWARTUNGSHORIZONT:\n${a.erwartung.map(e=>'- '+e.text+' ('+e.be+' BE)').join('\n')}\nMUSTERLÖSUNG:\n${htmlToText(a.loesung)}\n\nLÖSUNG DES SCHÜLERS:\n${st.draft[a.nr]||'(leer)'}`;
    aiFeedback('ai'+a.nr,sys,usr,copyAll); });
  document.getElementById('fin').onclick=()=>{ const {g,mx,pk}=calc(), auf={};
    k.aufgaben.forEach(a=>{ let e=0; const items=a.erwartung.map((x,i)=>{ const on=document.querySelector(`[data-c="${a.nr}-${i}"]`).checked; if(on) e+=x.be; else addFokus(k.fachId,x.text,x.stichworte,'Probeklausur'); return on?x.be:0; });
      auf[a.nr]={erreicht:e,max:a.be,items,kommentare:{}}; });
    (st.results=st.results||[]).push({date:today(),aufgaben:auf,be:g,max:mx,punkte:pk,quelle:'Selbstkontrolle',antworten:Object.assign({},st.draft),berichtigung:{}}); st.draft={};
    markDay(); S.history.push({date:today(),deck:'klausur:'+k.id,mode:'Probeklausur',score:g,total:mx}); save();
    const prev=st.results.length>1?st.results[st.results.length-2]:null;
    $app.innerHTML=`<div class="card center"><div class="huge">📝</div><h2>${esc(k.titel)}</h2>
      <p style="font-size:20px"><span class="dot ${AMP_CLS[ampelFromPunkte(pk)]}" style="width:16px;height:16px"></span><b>${g}/${mx} BE → ${pk} Punkte (Note ${NOTEN[pk]})</b></p>
      ${prev?`<p class="small muted">Letztes Mal: ${prev.be}/${prev.max} BE → ${prev.punkte} P.</p>`:''}
      <p class="small">${k.aufgaben.map(a=>`Aufgabe ${a.nr}: ${auf[a.nr].erreicht}/${a.be} BE`).join(' · ')}</p>
      <p class="small muted">Nicht erreichte Punkte aus dem Erwartungshorizont sind jetzt 🎯 Baustellen – das Fokus-Training übt sie gezielt.</p>
      <div class="row" style="justify-content:center"><button class="primary" id="kb">📋 Korrekturbogen öffnen</button><button id="b">Fertig</button></div></div>`;
    document.getElementById('kb').onclick=()=>korrekturbogen(k,st.results.length-1);
    document.getElementById('b').onclick=()=>go({name:'fach',fid:k.fachId,tab:'probeklausur'}); };
}

/* ---------- Korrekturbogen: Erwartungshorizont je Punkt, Kommentare, Berichtigung ---------- */
function korrekturbogen(k,idx){
  view={name:'fach',fid:k.fachId,tab:'probeklausur'};
  const st=S.pk[k.id], r=st.results[idx]; r.berichtigung=r.berichtigung||{};
  const farbe=(e,m)=>e>=m?'a-gruen':e>0?'a-gelb':'a-rot';
  const draw=()=>{
    const offen=k.aufgaben.reduce((s,a)=>{ const x=r.aufgaben[a.nr]; if(!x||!x.items) return s; return s+a.erwartung.filter((e,i)=>x.items[i]<e.be&&!((r.berichtigung[a.nr]||{})[i]||{}).ok).length; },0);
    $app.innerHTML=`<div class="row between"><button class="ghost small" id="b">← Zurück</button><span class="chip">📋 Korrekturbogen · ${de(r.date)} · ${esc(r.quelle||'')}</span></div>
      <div class="card"><h2>${esc(k.titel)}</h2><p style="font-size:18px"><span class="dot ${AMP_CLS[ampelFromPunkte(r.punkte)]}"></span><b>${r.be}/${r.max} BE → ${r.punkte} Punkte (Note ${NOTEN[r.punkte]})</b></p>
        <p class="small muted" style="margin:0">🟢 voll erreicht · 🟡 teilweise · 🔴 verfehlt. Bei jedem nicht vollen Punkt: Berichtigung schreiben und als ausgebessert markieren. ${offen?`<b>${offen} Punkt(e) noch auszubessern.</b>`:'<b>Alles ausgebessert ✔</b>'}</p></div>
      ${k.aufgaben.map(a=>{ const x=r.aufgaben[a.nr]||{erreicht:0,max:a.be}; const items=x.items||a.erwartung.map(()=>null); const kom=x.kommentare||{};
        return `<div class="card"><div class="row between"><h2 style="margin:0">Aufgabe ${a.nr} · ${esc(a.operator)}</h2><span class="chip"><span class="dot ${farbe(x.erreicht,a.be)}"></span>${x.erreicht}/${a.be} BE</span></div>
          <p class="small muted">${esc(a.text)}</p>
          ${a.erwartung.map((e,i)=>{ const got=items[i]; const b=(r.berichtigung[a.nr]||{})[i]||{}; const voll=got!=null&&got>=e.be;
            return `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><span><span class="dot ${got==null?'':farbe(got,e.be)}" style="${got==null?'border:1px solid var(--muted)':''}"></span>${esc(e.text)}</span><span class="chip">${got==null?'?':got}/${e.be} BE</span></div>
              ${kom[i]?`<div class="small" style="margin:4px 0 0 18px">💬 ${esc(kom[i])}</div>`:''}
              ${voll?'':`<div style="margin:6px 0 0 18px">${b.ok?`<div class="small" style="color:var(--ok)">✔ ausgebessert: ${esc(b.text||'')}</div>`:`<textarea data-ber="${a.nr}-${i}" style="min-height:60px" placeholder="Berichtigung: So hätte ich den Punkt geholt …">${esc(b.text||'')}</textarea><button class="small" data-ok="${a.nr}-${i}">✔ Als ausgebessert markieren</button>`}</div>`}</div>`; }).join('')}
          <details style="margin-top:8px"><summary><b>Deine Lösung</b></summary><p style="white-space:pre-wrap">${esc((r.antworten||{})[a.nr]||'(nicht gespeichert)')}</p></details>
          <details style="margin-top:6px"><summary><b>Musterlösung</b></summary><div class="lz">${a.loesung}</div></details></div>`; }).join('')}`;
    document.getElementById('b').onclick=()=>go({name:'fach',fid:k.fachId,tab:'probeklausur'});
    $app.querySelectorAll('[data-ber]').forEach(ta=>ta.oninput=()=>{ const [n,i]=ta.dataset.ber.split('-'); r.berichtigung[n]=r.berichtigung[n]||{}; r.berichtigung[n][i]=Object.assign(r.berichtigung[n][i]||{},{text:ta.value}); save(); });
    bind('[data-ok]',b=>{ const [n,i]=b.dataset.ok.split('-'); const ta=document.querySelector(`[data-ber="${n}-${i}"]`);
      if(!ta.value.trim()||ta.value.trim().length<15){ alert('Schreib erst eine kurze Berichtigung (mindestens einen Satz) – dann zählt es als ausgebessert.'); return; }
      r.berichtigung[n]=r.berichtigung[n]||{}; r.berichtigung[n][i]={text:ta.value.trim(),ok:today()};
      const e=k.aufgaben.find(a=>a.nr==n).erwartung[i];
      openFokus(k.fachId).filter(f=>norm(f.begriff)===norm(e.text)).forEach(f=>{ f.treffer=(f.treffer||0)+1; if(f.treffer>=3) f.erledigt=today(); });
      markDay(); save(); draw(); });
  };
  draw();
}

/* ---------- Geführte Lerneinheit: Lesen → Abrufen → Vergleich → Aufgabe ---------- */
const norm=s=>String(s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
let eTimer=null;
function countdown(sec,elId,onEnd){
  clearInterval(eTimer); const end=Date.now()+sec*1000;
  const upd=()=>{ const el=document.getElementById(elId); if(!el){ clearInterval(eTimer); return; }
    const left=Math.max(0,Math.round((end-Date.now())/1000)); el.textContent=tFmt(left);
    if(left===0){ clearInterval(eTimer); el.textContent='Zeit um'; el.classList.add('hot'); onEnd&&onEnd(); } };
  upd(); eTimer=setInterval(upd,500);
}
function copyText(txt,btn){
  const done=()=>{ if(btn){ const o=btn.textContent; btn.textContent='✔ Kopiert – jetzt bei Claude einfügen (Strg+V)'; setTimeout(()=>btn.textContent=o,4000); } };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,()=>fallback());
  else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ alert('Kopieren nicht möglich – bitte Text manuell markieren.'); } ta.remove(); }
}
function startEinheit(e){
  view={name:'fach',fid:e.fachId,tab:'klassisch'};
  const st={recall:'',answer:'',tips:0,covered:[],self:null};
  const head=(n,label,timer)=>`<div class="row between"><button class="ghost small" id="b">← Abbrechen</button>
    <span class="row"><span class="chip">Schritt ${n}/4 · ${label}</span>${timer?`<span class="chip" id="tmr"></span>`:''}</span></div>
    <div class="bar" style="height:6px;margin-top:8px"><i style="width:${(n-1)*25}%;background:var(--accent)"></i></div>`;
  const back=()=>{ clearInterval(eTimer); stopRec(); go({name:'fach',fid:e.fachId,tab:'klassisch'}); };

  function lesen(){
    $app.innerHTML=head(1,'Lesen',true)+`<div class="card"><h2>${esc(e.titel)}</h2>
      <p class="small muted" style="margin-top:0">Lies aufmerksam – gleich klappst du zu und gibst alles aus dem Kopf wieder. Ca. ${e.lesezeit||5} Minuten.</p>
      <div class="lz">${e.lesen}</div><p class="src">Quelle: ${esc(e.quelle)}</p>
      <button class="primary" id="nx" style="margin-top:10px">Fertig gelesen → zuklappen</button></div>`;
    document.getElementById('b').onclick=back; document.getElementById('nx').onclick=abrufen;
    countdown((e.lesezeit||5)*60,'tmr');
  }
  let rec=null, recOn=false;
  function stopRec(){ if(rec&&recOn){ try{ rec.stop(); }catch(_){ } } recOn=false; }
  function abrufen(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    $app.innerHTML=head(2,'Aus dem Kopf',true)+`<div class="card"><h2>Was weißt du noch?</h2>
      <p class="small muted" style="margin-top:0">Schreib oder sprich alles, was du zu „${esc(e.titel)}“ noch weißt – Stichpunkte reichen. Nicht nachschauen! Ca. ${e.abrufzeit||8} Minuten.</p>
      <div class="row" style="margin-bottom:8px">${SR?`<button id="mic">🎤 Sprechen</button><span class="small muted" id="micst"></span>`:`<span class="small muted">🎤 Tipp: Mit <b>Windows-Taste + H</b> kannst du in das Feld diktieren.</span>`}</div>
      <textarea id="rt" style="min-height:220px" placeholder="Alles, was dir einfällt …">${esc(st.recall)}</textarea>
      <div class="small muted" id="interim" style="min-height:1.2em"></div>
      <button class="primary" id="nx" style="margin-top:8px">Fertig → vergleichen</button></div>`;
    const ta=document.getElementById('rt');
    document.getElementById('b').onclick=back;
    document.getElementById('nx').onclick=()=>{ st.recall=ta.value.trim(); if(!st.recall){ alert('Schreib oder sprich erst ein paar Stichpunkte – auch „weiß ich nicht mehr“ ist okay.'); return; } stopRec(); vergleich(); };
    countdown((e.abrufzeit||8)*60,'tmr');
    if(SR){
      const mic=document.getElementById('mic'), ms=document.getElementById('micst');
      mic.onclick=()=>{
        if(recOn){ stopRec(); mic.textContent='🎤 Sprechen'; ms.textContent=''; return; }
        rec=new SR(); rec.lang='de-DE'; rec.continuous=true; rec.interimResults=true;
        rec.onresult=ev=>{ let interim=''; for(let k=ev.resultIndex;k<ev.results.length;k++){ const r=ev.results[k];
            if(r.isFinal) ta.value=(ta.value+' '+r[0].transcript).trim(); else interim+=r[0].transcript; }
          document.getElementById('interim').textContent=interim; };
        rec.onerror=ev=>{ ms.textContent=ev.error==='not-allowed'?'Mikrofon nicht erlaubt – im Browser freigeben oder Windows+H nutzen.':'Spracheingabe nicht verfügbar – Windows+H nutzen.'; recOn=false; mic.textContent='🎤 Sprechen'; };
        rec.onend=()=>{ if(recOn){ try{ rec.start(); }catch(_){ } } };
        try{ rec.start(); recOn=true; mic.textContent='⏹ Stopp'; ms.textContent='Ich höre zu …'; }catch(err){ ms.textContent='Spracheingabe nicht verfügbar – Windows+H nutzen.'; }
      };
    }
  }
  function vergleich(){
    clearInterval(eTimer);
    const t=norm(st.recall);
    st.covered=e.kernpunkte.map(k=>k.stichworte.some(w=>t.includes(norm(w))));
    e.kernpunkte.forEach((k,i)=>{ if(!st.covered[i]) addFokus(e.fachId,k.punkt,k.stichworte,'Lerneinheit');
      else openFokus(e.fachId).filter(f=>norm(f.begriff)===norm(k.punkt)).forEach(f=>{ f.treffer=(f.treffer||0)+1; if(f.treffer>=3) f.erledigt=today(); }); });
    save();
    const n=st.covered.filter(Boolean).length, tot=e.kernpunkte.length, pct=n/tot;
    const prompt=`Hallo Claude, ich bin ${player}. Bitte vergleiche meine Wiedergabe zur Lerneinheit „${e.titel}“ (${(fachById(e.fachId)||{}).name}) mit den Kernpunkten. Sag mir kurz: Was fehlt? Was ist ungenau oder falsch? Was war gut?\n\nKernpunkte:\n${e.kernpunkte.map((k,i)=>`${i+1}. ${k.punkt}`).join('\n')}\n\nMeine Wiedergabe (aus dem Kopf):\n${st.recall}`+UPDATE_ANWEISUNG(e.fachId,e.id);
    $app.innerHTML=head(3,'Vergleich',false)+`<div class="card"><div class="row between"><h2>${n} von ${tot} Kernpunkten erkannt</h2><span class="chip ${pct>=0.8?'':'hot'}">${Math.round(pct*100)} %</span></div>
      <p class="small muted" style="margin-top:0">Automatische Stichwort-Prüfung – ein schneller Anhaltspunkt, keine Korrektur. Für eine genaue Rückmeldung: an Claude schicken.</p>
      ${e.kernpunkte.map((k,i)=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b style="color:${st.covered[i]?'var(--ok)':'var(--bad)'}">${st.covered[i]?'✔':'✘'}</b> ${esc(k.punkt)}</div>`).join('')}
      <div id="aiv" style="margin-top:12px"></div>
      <details style="margin-top:8px"><summary><b>Deine Wiedergabe</b></summary><p style="white-space:pre-wrap">${esc(st.recall)}</p></details>
      <details style="margin-top:8px" ${pct<0.8?'open':''}><summary><b>Original zum Vergleich</b></summary><div class="lz">${e.lesen}</div></details>
      <button class="primary" id="nx" style="margin-top:12px">Weiter → Übungsaufgabe</button></div>`;
    document.getElementById('b').onclick=back;
    const fName=(fachById(e.fachId)||{}).name;
    const sysV=`Du bist Lernbegleiter für ${player} (Oberstufe, Schleswig-Holstein, Fach ${fName}, Niveau ${niveau(e.fachId)||'unbekannt'}). Vergleiche die Wiedergabe aus dem Kopf mit dem Lernzettel und den Kernpunkten. Stütze dich NUR auf den mitgelieferten Lernzettel und füge keine neuen Fakten hinzu. Tippfehler aus Spracheingabe ignorieren, Fachbegriffe aber korrekt nennen. Antworte auf Deutsch, du-Form, ermutigend und knapp (max. 170 Wörter) mit genau diesen Abschnitten: **Gut:**, **Fehlt:**, **Ungenau oder falsch:**, **Merksatz für die Klausur:** (ein Satz mit den wichtigsten Fachbegriffen). Letzte Zeile exakt: FOKUS: <fehlende Fachbegriffe, mit Semikolon getrennt, oder -> `;
    const userV=`LERNZETTEL „${e.titel}“:
${htmlToText(e.lesen)}

KERNPUNKTE:
${e.kernpunkte.map((k,i)=>`${i+1}. ${k.punkt}`).join('\n')}

WIEDERGABE DES SCHÜLERS (aus dem Kopf):
${st.recall}`;
    aiFeedback('aiv',sysV,userV,prompt);
    document.getElementById('nx').onclick=aufgabe;
  }
  function aufgabe(){
    const a=e.aufgabe;
    $app.innerHTML=head(4,'Übungsaufgabe',true)+`<div class="card"><span class="chip hot">${esc(a.operator)}</span>
      <h2 style="margin-top:8px">${esc(a.text)}</h2>${a.material?`<div class="feedback small">${a.material}</div>`:''}
      <p class="small muted">Erst selbst versuchen – die Musterlösung gibt es danach. Ca. ${a.zeit||8} Minuten.</p>
      <textarea id="at" style="min-height:200px" placeholder="Deine Antwort …">${esc(st.answer)}</textarea>
      <div id="tipbox"></div>
      <div class="row" style="margin-top:8px"><button id="tip">💡 Tipp (${a.tipps.length-st.tips} übrig)</button><button class="primary" id="sol">Lösung zeigen</button></div></div>`;
    const at=document.getElementById('at');
    const showTips=()=>{ document.getElementById('tipbox').innerHTML=a.tipps.slice(0,st.tips).map(t=>`<div class="feedback small">💡 ${esc(t)}</div>`).join(''); };
    showTips();
    document.getElementById('b').onclick=back;
    countdown((a.zeit||8)*60,'tmr');
    document.getElementById('tip').onclick=ev=>{ if(st.tips<a.tipps.length){ st.tips++; showTips(); ev.target.textContent=`💡 Tipp (${a.tipps.length-st.tips} übrig)`; } };
    document.getElementById('sol').onclick=()=>{ st.answer=at.value.trim();
      if(st.answer.length<40){ alert('Schreib erst einen eigenen Versuch (mindestens ein paar Sätze) – dann kommt die Musterlösung. Tipps helfen beim Start.'); return; }
      loesung(); };
  }
  function loesung(){
    clearInterval(eTimer);
    const a=e.aufgabe;
    const prompt=`Hallo Claude, ich bin ${player}. Bitte korrigiere meine Antwort wie eine Lehrkraft (Fach ${(fachById(e.fachId)||{}).name}, ${niveau(e.fachId)||''}): Was ist gut, was fehlt, was ist falsch, und wie viele von 10 Punkten würdest du ungefähr geben?\n\nAufgabe (${a.operator}): ${a.text}\n\nMeine Antwort:\n${st.answer}`+UPDATE_ANWEISUNG(e.fachId,e.id);
    $app.innerHTML=head(4,'Übungsaufgabe',false)+`<div class="card"><h2>Musterlösung</h2><div class="lz">${a.loesung}</div>
      <details style="margin-top:8px"><summary><b>Deine Antwort</b></summary><p style="white-space:pre-wrap">${esc(st.answer)}</p></details>
      <div id="aia" style="margin-top:12px"></div><div id="aip"></div>
      <h3>Wie gut war deine Antwort im Vergleich?</h3>
      <div class="row"><button data-self="gut">✔ Hatte ich im Wesentlichen</button><button data-self="teils">〰 Teilweise</button><button data-self="kaum">✘ Kaum</button></div></div>`;
    document.getElementById('b').onclick=back;
    const fName=(fachById(e.fachId)||{}).name;
    const sysA=`Du bist eine erfahrene Lehrkraft (Oberstufe, Schleswig-Holstein, Fach ${fName}, Niveau ${niveau(e.fachId)||'unbekannt'}) und bewertest eine Übungsantwort von ${player}. Nutze die Musterlösung und das Material als Erwartungshorizont und achte auf den Operator „${a.operator}“. Füge keine neuen Fakten hinzu; nennt der Schüler zusätzliche Fakten, die du nicht sicher prüfen kannst, markiere sie mit „bitte mit Unterricht abgleichen“. Antworte auf Deutsch, du-Form, konstruktiv, max. 200 Wörter, mit den Abschnitten **Gut:**, **Fehlt:**, **Ungenau oder falsch:**, **So holst du mehr Punkte:**. Vorletzte Zeile exakt: FOKUS: <fehlende oder falsche Fachbegriffe, mit Semikolon getrennt, oder ->. Letzte Zeile exakt: PUNKTE: <Zahl von 0 bis 15>/15`;
    const userA=`AUFGABE (${a.operator}): ${a.text}
${a.material?'MATERIAL: '+htmlToText(a.material)+'\n':''}
MUSTERLÖSUNG / ERWARTUNGSHORIZONT:
${htmlToText(a.loesung)}

ANTWORT DES SCHÜLERS:
${st.answer}`;
    aiFeedback('aia',sysA,userA,prompt,text=>{
      const m=text.match(/PUNKTE:\s*(\d{1,2})/); if(!m) return;
      const pk=Math.max(0,Math.min(15,+m[1])); st.punkte=pk;
      const sug=pk>=12?'gut':pk>=7?'teils':'kaum';
      document.getElementById('aip').innerHTML=`<p><span class="dot ${AMP_CLS[ampelFromPunkte(pk)]}"></span><b>Einschätzung von Claude: ${pk} Punkte (Note ${NOTEN[pk]})</b></p>`;
      $app.querySelectorAll('[data-self]').forEach(b=>{ if(b.dataset.self===sug){ b.classList.add('primary'); b.textContent+=' ← Vorschlag'; } });
    });
    bind('[data-self]',b=>{ st.self=b.dataset.self; fertig(); });
  }
  function fertig(){
    const n=st.covered.filter(Boolean).length, tot=e.kernpunkte.length, pct=n/tot;
    const amp=(pct>=0.8&&st.self==='gut')?'gruen':(pct>=0.5&&st.self!=='kaum')?'gelb':'rot';
    const labels={gut:'im Wesentlichen',teils:'teilweise',kaum:'kaum'};
    const fd=F(e.fachId), themen=[].concat(e.thema||[]), changed=[];
    themen.forEach(name=>{ const t=fd.themen.find(x=>x.name===name); if(t){ t.ampel=amp; changed.push(name); } else { fd.themen.push({id:uid(),name,ampel:amp}); changed.push(name); } });
    S.klassisch=S.klassisch||{}; S.klassisch[e.id]={date:today(),covered:n,total:tot,self:st.self,selfLabel:labels[st.self],punkte:st.punkte??null};
    markDay(); S.history.push({date:today(),deck:'einheit:'+e.id,mode:'Klassisch',score:n,total:tot}); save();
    const col={gruen:'a-gruen',gelb:'a-gelb',rot:'a-rot'}[amp], word={gruen:'Grün – sitzt!',gelb:'Gelb – fast da',rot:'Rot – nochmal dran'}[amp];
    $app.innerHTML=`<div class="card center"><div class="huge">🏁</div><h2>Lerneinheit geschafft!</h2>
      <p>Kernpunkte aus dem Kopf: <b>${n}/${tot}</b> · Übungsaufgabe: <b>${labels[st.self]}</b></p>
      <p><span class="dot ${col}"></span>Ampel ${changed.map(c=>'„'+esc(c)+'“').join(', ')}: <b>${word}</b></p>
      <p class="small muted">${amp==='gruen'?'Morgen reicht eine kurze Quiz-Runde zur Wiederholung.':'Tipp: Mach morgen die Einheit nochmal – Wiederholen mit Abstand wirkt am besten.'}</p>
      <button class="primary" id="b">Fertig</button></div>`;
    document.getElementById('b').onclick=back;
  }
  lesen();
}

function tabStand(f){
  const fd=F(f.id);
  AFTER.stand=()=>{
    document.getElementById('saveBasis').onclick=()=>{
      fd.niveau=document.getElementById('niv').value; fd.pruefung=document.getElementById('pru').value.trim();

      const p=+document.getElementById('npunkte').value, d=document.getElementById('ndatum').value;
      if(!d||isNaN(p)||p<0||p>15){ alert('Bitte Datum und Punkte zwischen 0 und 15 eingeben.'); return; }

    bind('[data-delnote]',b=>{ if(confirm('Diese Note entfernen?')){ fd.noten=fd.noten.filter(n=>n.id!==b.dataset.delnote); save(); render(); } });

    bind('[data-amp]',b=>{ const [id,a]=b.dataset.amp.split('|'); const t=fd.themen.find(x=>x.id===id); if(t){ t.ampel=a; save(); render(); } });
    bind('[data-delthema]',b=>{ fd.themen=fd.themen.filter(t=>t.id!==b.dataset.delthema); save(); render(); });
    document.getElementById('addTermin').onclick=()=>{ const d=document.getElementById('tdatum').value, t=document.getElementById('ttitel').value.trim();
      if(!d||!t){ alert('Bitte Datum und Bezeichnung eingeben.'); return; } S.termine.push({id:'u-'+uid(),fach:f.id,datum:d,titel:t}); save(); render(); };
    bind('[data-deltermin]',b=>{ const id=b.dataset.deltermin; if(id.startsWith('u-')) S.termine=S.termine.filter(t=>t.id!==id); else S.hiddenTermine.push(id); save(); render(); });
  };
  const noten=fd.noten.slice().sort((a,b)=>b.datum.localeCompare(a.datum));
  const nv=niveau(f.id).replace(' (V)','');
  return `
  <div class="card"><h2>Basis</h2>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
      <label class="small">Kursniveau<br><select id="niv"><option value="">– bitte wählen –</option>
        ${['gA','eA'].map(o=>`<option ${nv===o?'selected':''}>${o}</option>`).join('')}</select></label>
      <label class="small">Prüfungsfach?<br><input id="pru" value="${esc(fd.pruefung||'')}" placeholder="z. B. schriftlich / mündlich / nein"></label>
      <label class="small">Aktuelles Thema im Unterricht<br><input id="thema" value="${esc(fd.thema||'')}" placeholder="z. B. Plattentektonik"></label>
    </div>
    <label class="small" style="display:block;margin-top:10px">Das kann ich gut<br><textarea id="st">${esc(fd.staerken||'')}</textarea></label>
    <label class="small" style="display:block;margin-top:6px">Da hakt es<br><textarea id="lu">${esc(fd.luecken||'')}</textarea></label>
    ${niveau(f.id).includes('(V)')&&!fd.niveau?'<p class="small muted">Vorbelegt von Papa – bitte bestätigen und speichern.</p>':''}

      <div class="card flash" id="flip"><div class="front">${esc(c.front)}</div>

    if(!flipped){ document.getElementById('flip').onclick=()=>show(true); return; }
    document.getElementById('yes').onclick=()=>rate(true); document.getElementById('no').onclick=()=>rate(false);
  }
  function rate(ok){ const c=list[i], st=S.leitner[c.key]||{box:0}; recordAnswer(c.key,ok);
    if(ok){ st.box=Math.min(5,st.box+1); st.due=addDays(INTERVALS[st.box]); known++; } else { st.box=1; st.due=addDays(1); }
    S.leitner[c.key]=st; i++;

}
