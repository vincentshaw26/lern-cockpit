function startCheck(deck){
  view={name:'fach',fid:deck.fachId,tab:'quiz'};
  const qs=buildQuiz(deck,CHECK_LEN), answers=[]; let self=0, i=0;
  $app.innerHTML=`<div class="row between"><button class="ghost small" id="b">← Zurück</button><span class="chip">🧭 Einstiegs-Check</span></div>
    <div class="card center"><h2>${esc(deck.titel)}</h2>
    <p>Bevor es losgeht: <b>Wie sicher fühlst du dich in diesem Thema?</b></p>
    <div class="row" style="justify-content:center">${[1,2,3,4,5].map(n=>`<button data-s="${n}" style="min-width:52px">${n}</button>`).join('')}</div>
    <p class="small muted">1 = keine Ahnung · 5 = kann ich im Schlaf. Danach ${qs.length} Fragen ohne Hilfen – es gibt keine Note, nur einen ehrlichen Startpunkt.</p></div>`;
  document.getElementById('b').onclick=backToFach();
  bind('[data-s]',b=>{ self=+b.dataset.s; show(); });
  function show(){ const q=qs[i];
    $app.innerHTML=`<div class="row between"><button class="ghost small" id="b">← Abbrechen</button><span class="chip">🧭 Check · Frage ${i+1}/${qs.length}</span></div>
      <div class="card"><h2>${esc(q.prompt)}</h2>${q.body?`<p style="font-size:17px">${esc(q.body)}</p>`:''}
      ${q.multi?multiOpts(q)+`<div class="row" style="margin-top:10px"><button class="primary" id="wei">Weiter</button><button class="ghost" id="wn"><i>Weiß ich nicht</i></button></div>`
        :`<div class="opts">${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}
      <button class="opt ghost" data-k="-1"><i>Weiß ich nicht</i></button></div>`}</div>`;
    document.getElementById('b').onclick=backToFach();
    const next=a=>{ answers.push(a); i++; i<qs.length?show():finish(); };
    if(q.multi){ let sel=[]; bindMulti(x=>sel=x); document.getElementById('wei').onclick=()=>next(sel); document.getElementById('wn').onclick=()=>next([]); }
    else $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>next(+b.dataset.k));
  }
  function finish(){
    const right=answers.filter((a,k)=>isRight(qs[k],a)).length, pct=right/qs.length;
    qs.forEach((q,k)=>{ const r=isRight(q,answers[k]); recordAnswer(q.key,r); if(!r) S.leitner[q.key]={box:1,due:addDays(1)}; });
    markDay(); S.checks.push({date:today(),deck:deck.id,self,score:right,total:qs.length});
    S.history.push({date:today(),deck:deck.id,mode:'Einstiegs-Check',score:right,total:qs.length}); save();
    const selfPct=(self-1)/4, diff=pct-selfPct;
    const verdict=Math.abs(diff)<0.2?'Deine Einschätzung passt ziemlich genau – gutes Gespür!'
      :diff>0?'Du kannst mehr, als du denkst! 💪':'Da ist mehr Luft nach oben als gedacht – gut, dass wir es jetzt wissen. Genau dort setzen wir an.';
    $app.innerHTML=`<div class="card center"><div class="huge">🧭</div><h2>${right} von ${qs.length} richtig</h2>
      <p>Gefühl: <b>${self}/5</b> · Ergebnis: <b>${Math.round(pct*100)} %</b></p><p>${verdict}</p>
      <p class="small muted">Die offenen Fragen sind jetzt als Lernkarten für morgen eingeplant. Den Check kannst du später wiederholen – dann siehst du schwarz auf weiß, was du dazugelernt hast.</p></div>
      <div class="card"><h3>Auflösung</h3>${qs.map((q,k)=>{ const ok=isRight(q,answers[k]);
        return `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${ok?'✔':'✘'}</b> ${esc(q.prompt)}${q.body?` <span class="muted small">${esc(q.body)}</span>`:''}
          <div class="small">Richtig: <b>${esc(correctText(q))}</b></div>${ok?'':`<div class="small muted">${esc(q.explain)}</div>`}</div>`; }).join('')}
      <p class="src">Quelle: ${esc(deck.quelle)}</p><button class="primary" id="b">Fertig</button></div>`;
    document.getElementById('b').onclick=backToFach();
  }
}

function startQuiz(deck,n,challenge){
  view={name:'fach',fid:deck.fachId,tab:'quiz'};
  const qs=buildQuiz(deck,n); let i=0, right=0, streak=0, best=0;
  function show(){ const q=qs[i];
    $app.innerHTML=`<div class="row between"><button class="ghost small" id="b">← Zurück</button><span class="row">${streak>=3?`<span class="chip hot">🔥 ${streak} in Folge</span>`:''}<span class="chip">${challenge?'🏅 Challenge · ':deck.onlyKeys?'🎯 Fokus · ':deck.decks?'🔀 Mix · ':''}Frage ${i+1}/${qs.length}</span></span></div>
      <div class="bar" style="height:6px;margin-top:8px"><i style="width:${Math.round(i/qs.length*100)}%;background:var(--accent)"></i></div>
      <div class="card"><h2>${esc(q.prompt)}</h2>${q.body?`<p style="font-size:17px">${esc(q.body)}</p>`:''}
      ${q.multi?multiOpts(q)+`<div class="row" style="margin-top:10px"><button class="primary" id="chk" disabled>Antwort prüfen</button></div>`
        :`<div class="opts">${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div>`}<div id="fb"></div></div>`;
    document.getElementById('b').onclick=backToFach();
    if(q.multi){ let sel=[]; bindMulti(x=>{ sel=x; document.getElementById('chk').disabled=!sel.length; }); document.getElementById('chk').onclick=()=>{ document.getElementById('chk').remove(); answer(sel); }; }
    else $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  }
  function answer(k){ const q=qs[i], ok=isRight(q,k);
    if(q.multi){ $app.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; const kk=+b.dataset.k, c=q.correctSet.includes(kk), s=k.includes(kk); b.classList.remove('multi','sel');
        if(c&&s) b.classList.add('right'); else if(c) b.classList.add('missed'); else if(s) b.classList.add('wrong'); }); }
    else $app.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; const kk=+b.dataset.k; if(kk===q.correct) b.classList.add('right'); else if(kk===k) b.classList.add('wrong'); });
    const multiInfo=q.multi&&!ok?` (${k.filter(x=>q.correctSet.includes(x)).length} von ${q.correctSet.length} richtigen gefunden${k.some(x=>!q.correctSet.includes(x))?', '+k.filter(x=>!q.correctSet.includes(x)).length+' falsch gewählt':''})`:'';
    recordAnswer(q.key,ok);
    if(ok){ right++; streak++; best=Math.max(best,streak); } else { streak=0; S.leitner[q.key]={box:1,due:addDays(1)}; }
    const cheer=streak===5?' 🔥 5 in Folge!':streak===10?' 🚀 10 in Folge – stark!':'';
    document.getElementById('fb').innerHTML=`<div class="feedback"><b>${ok?(q.multi?'Richtig – alle '+q.correctSet.length+' gefunden! ✔':'Richtig! ✔')+cheer:'Nicht ganz'+multiInfo+' – kommt morgen als Lernkarte wieder.'}</b><div style="margin-top:6px">${esc(q.explain)}</div>
      <div class="src">Quelle: ${esc(q.source)}</div><div style="margin-top:10px"><button class="primary" id="next">${i+1<qs.length?'Weiter':'Auswertung'}</button></div></div>`;
    document.getElementById('next').onclick=()=>{ i++; i<qs.length?show():finish(); };
  }
  function finish(){ const pct=right/qs.length, mode=challenge?'Challenge':'Quiz';
    markDay(); S.history.push({date:today(),deck:deck.id,mode,score:right,total:qs.length});
    let medal='';
    if(challenge&&pct>=CHALLENGE_PASS){ const first=!S.orden[deck.id]; S.orden[deck.id]={date:(S.orden[deck.id]||{}).date||today(),best:Math.max(right,(S.orden[deck.id]||{}).best||0)};
      medal=`<div class="medal" style="margin:10px auto">${medalSvg(true)}</div><h2>${first?'Neuer Orden!':'Orden verteidigt!'}</h2>`; }
    save();
    const prev=S.history.filter(h=>h.deck===deck.id&&h.mode===mode).slice(-2,-1)[0];
    $app.innerHTML=`<div class="card center">${medal||'<div class="huge">🎯</div>'}<h2>${right} von ${qs.length} richtig</h2>
      ${best>=3?`<p class="small">🔥 Beste Serie: ${best} in Folge</p>`:''}
      ${prev?`<p class="small muted">Letztes Mal: ${prev.score}/${prev.total}.</p>`:''}
      <p class="muted small">${pct>=CHALLENGE_PASS?'Starke Runde.':challenge?`Für den Orden brauchst du ${Math.ceil(CHALLENGE_PASS*qs.length)} richtige. Die falschen Fragen kommen morgen als Lernkarten – danach nochmal versuchen.`:'Die falschen Fragen kommen morgen als Lernkarten wieder.'}</p>
      <button class="primary" id="b">Weiter</button></div>`;
    document.getElementById('b').onclick=backToFach();
  }
  show();
}

/* ---------- KI-Feedback über die Claude API (eigener API-Schlüssel, nur auf diesem Gerät gespeichert) ---------- */
const API_KEY_STORE='lerncockpit:apikey', AI_MODEL='claude-opus-5';
function apiKey(){ return store.get(API_KEY_STORE)||''; }
async function askClaude(system,userText){
  const key=apiKey(); if(!key) throw {code:'nokey',message:'KI-Feedback ist noch nicht eingerichtet (⚙️ oben rechts).'};
  const call=async withFallback=>{
    const headers={'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
    const body={model:AI_MODEL,max_tokens:2000,output_config:{effort:'medium'},system,messages:[{role:'user',content:userText}]};
    if(withFallback){ headers['anthropic-beta']='server-side-fallback-2026-07-01'; body.fallbacks='default'; }
    let res; try{ res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,body:JSON.stringify(body)}); }
    catch(e){ throw {code:'offline',message:'Keine Verbindung zu Claude – KI-Feedback braucht Internet. Alternativ: Text kopieren und bei Claude einfügen.'}; }
    let data={}; try{ data=await res.json(); }catch(_){ }
    return {res,data};
  };
  let {res,data}=await call(true);
  if(res.status===400&&/fallback|beta/i.test(((data.error||{}).message)||'')) ({res,data}=await call(false));   // falls Fallback-Option nicht verfügbar
  if(!res.ok){
    const map={401:'Der API-Schlüssel ist ungültig – bitte unter ⚙️ prüfen.',403:'Zugriff verweigert – Schlüssel oder Konto in der Anthropic Console prüfen.',
      429:'Zu viele Anfragen oder Ausgabenlimit erreicht – kurz warten bzw. Guthaben/Limit in der Anthropic Console prüfen.',529:'Claude ist gerade überlastet – bitte gleich nochmal versuchen.'};
    const msg=((data.error||{}).message)||'';
    throw {code:res.status,message:map[res.status]||(res.status>=500?'Serverfehler bei Anthropic – bitte gleich nochmal versuchen.':`Fehler ${res.status}${msg?': '+msg:''}`)};
  }
  if(data.stop_reason==='refusal') throw {code:'refusal',message:'Claude hat diese Anfrage nicht beantwortet.'};
  const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
  if(!text) throw {code:'empty',message:'Keine Antwort erhalten – bitte nochmal versuchen.'};
  return text;
}
function mdLite(t){   // kleines Markdown → HTML (fett, Listen, Zeilenumbrüche)
  const lines=esc(t).split('\n'); let out='', inList=false;
  lines.forEach(l=>{ const b=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(/^\s*([-•*]|\d+\.)\s+/.test(l)){ if(!inList){ out+='<ul style="margin:4px 0;padding-left:20px">'; inList=true; } out+='<li>'+b.replace(/^\s*([-•*]|\d+\.)\s+/,'')+'</li>'; }
    else { if(inList){ out+='</ul>'; inList=false; } out+=b.trim()?(/^#+\s/.test(l)?'<h3>'+b.replace(/^#+\s/,'')+'</h3>':'<p style="margin:6px 0">'+b+'</p>'):''; } });
  return out+(inList?'</ul>':'');
}
const htmlToText=h=>{ const d=document.createElement('div'); d.innerHTML=h; return d.innerText; };
/* Rendert einen KI-Feedback-Block in #elId; onText(text) liefert die Antwort zurück */
async function aiFeedback(elId,system,userText,copyPrompt,onText){
  const el=document.getElementById(elId); if(!el) return;
  if(!apiKey()){ el.innerHTML=`<div class="feedback small">🤖 KI-Feedback ist noch nicht eingerichtet (⚙️ oben rechts). Bis dahin: <button class="small" id="${elId}-cp">📋 Kopieren für Claude</button></div>`;
    document.getElementById(elId+'-cp').onclick=ev=>copyText(copyPrompt,ev.target); return; }
  el.innerHTML=`<div class="feedback">🤖 <b>Claude liest deine Antwort …</b> <span class="small muted">(ca. 10–30 Sek.)</span></div>`;
  try{ const text=await askClaude(system,userText); if(!document.getElementById(elId)) return;
    el.innerHTML=`<div class="feedback" style="border-left:4px solid var(--accent)"><div class="small muted" style="margin-bottom:4px">🤖 Feedback von Claude</div>${mdLite(text.replace(/^\s*PUNKTE:.*$/m,'').replace(/^\s*FOKUS:.*$/m,'').trim())}</div>`;
    const fm=text.match(/^\s*FOKUS:\s*(.+)$/m), fidNow=view.fid;
    if(fm&&fidNow&&fm[1].trim()!=='-'){ fm[1].split(';').map(x=>x.trim()).filter(x=>x&&x!=='-').forEach(b=>addFokus(fidNow,b,[b.split(/\s+/)[0].slice(0,8)],'Claude (App)')); save(); }
    onText&&onText(text);
  }catch(err){ if(!document.getElementById(elId)) return;
    el.innerHTML=`<div class="feedback small">⚠️ ${esc(err.message||'Unbekannter Fehler')} <button class="small" id="${elId}-cp">📋 Stattdessen kopieren</button> <button class="small" id="${elId}-re">🔁 Nochmal</button></div>`;
    document.getElementById(elId+'-cp').onclick=ev=>copyText(copyPrompt,ev.target);
    document.getElementById(elId+'-re').onclick=()=>aiFeedback(elId,system,userText,copyPrompt,onText); }
}
function openSettings(){
  const ov=document.createElement('div'); ov.className='overlay';
  const draw=()=>{ const has=!!apiKey();
    ov.innerHTML=`<div class="card" style="max-width:480px"><h2>⚙️ KI-Feedback (Claude)</h2>
      <p class="small">Status: <b>${has?'✔ eingerichtet':'✘ noch nicht eingerichtet'}</b></p>
      <p class="small muted">Mit einem Anthropic-API-Schlüssel gibt Claude direkt in der App Feedback zu deinen Antworten – ohne Kopieren. Der Schlüssel wird <b>nur in diesem Browser auf diesem Gerät</b> gespeichert. Kosten: grob 2–5 Cent pro Feedback (Modell ${AI_MODEL}), abgerechnet über die Anthropic Console. Gesendet werden nur Lernzettel, Aufgabe und deine Antwort – keine Noten.</p>
      <input type="password" id="k" placeholder="${has?'Neuen Schlüssel einfügen (sk-ant-…)':'API-Schlüssel einfügen (sk-ant-…)'}" style="width:100%" autocomplete="off">
      <div class="row" style="margin-top:10px"><button class="primary" id="ks">Speichern</button>${has?'<button id="kt">Verbindung testen</button><button id="kd">Schlüssel entfernen</button>':''}<button id="kc">Schließen</button></div>
      <div id="kr" class="small" style="margin-top:8px"></div></div>`;
    ov.querySelector('#ks').onclick=()=>{ const v=ov.querySelector('#k').value.trim(); if(!/^sk-ant-/.test(v)){ ov.querySelector('#kr').textContent='Das sieht nicht wie ein Anthropic-Schlüssel aus (beginnt mit „sk-ant-“).'; return; } store.set(API_KEY_STORE,v); draw(); ov.querySelector('#kr').textContent='Gespeichert ✔ – jetzt „Verbindung testen“.'; };
    if(has){ ov.querySelector('#kt').onclick=async()=>{ const r=ov.querySelector('#kr'); r.textContent='Teste …';
        try{ const t=await askClaude('Antworte nur mit dem Wort OK.','Verbindungstest'); r.textContent='✔ Verbindung klappt ('+t.slice(0,20)+').'; }catch(e){ r.textContent='✘ '+e.message; } };
      ov.querySelector('#kd').onclick=()=>{ if(confirm('API-Schlüssel von diesem Gerät entfernen?')){ try{ localStorage.removeItem(API_KEY_STORE); }catch(_){ } draw(); } }; }
    ov.querySelector('#kc').onclick=()=>ov.remove();
  };
  draw(); document.body.appendChild(ov);
}
document.getElementById('setBtn').onclick=openSettings;

/* ---------- Wissensstand: Punkte-Schätzung + Noten-Ampel (rot ≤ 3−, gelb 3 bis 2, grün ≥ 2+) ---------- */
const NOTEN=['6','5−','5','5+','4−','4','4+','3−','3','3+','2−','2','2+','1−','1','1+'];
function pctToPunkte(p){ for(const [g,pk] of [[.95,15],[.90,14],[.85,13],[.80,12],[.75,11],[.70,10],[.65,9],[.60,8],[.55,7],[.50,6],[.45,5],[.40,4],[.33,3],[.27,2],[.20,1]]) if(p>=g) return pk; return 0; }
const ampelFromPunkte=pk=>pk>=12?'gruen':pk>=8?'gelb':'rot';
function recordAnswer(key,ok){ S.ans=S.ans||{}; const a=S.ans[key]||[]; a.push(ok?1:0); S.ans[key]=a.slice(-3); fokusProgress(key,ok); }
function deckAccuracy(deck){
  const keys=allCards(deck).map(c=>c.key), got=keys.filter(k=>S.ans&&S.ans[k]&&S.ans[k].length);
  if(got.length<5) return null;   // erst ab 5 beantworteten Fragen aussagekräftig
  return {pct:got.reduce((s,k)=>s+S.ans[k][S.ans[k].length-1],0)/got.length,n:got.length,total:keys.length};
}
function themaWissen(fid,name){
  const parts=[];
  EINHEITEN.filter(e=>e.fachId===fid&&[].concat(e.thema).includes(name)).forEach(e=>{ const r=(S.klassisch||{})[e.id]; if(!r) return;
    const auf=r.punkte!=null?r.punkte/15:({gut:.85,teils:.6,kaum:.3}[r.self]??.5);
    parts.push(r.covered!=null&&r.total?.4*(r.covered/r.total)+.6*auf:auf); });   // nur Claude-Bewertung vorhanden → nur Punkte zählen
  decksFor(fid).filter(d=>(d.themen||[]).includes(name)).forEach(d=>{ const a=deckAccuracy(d); if(a) parts.push(a.pct); });
  KLAUSUREN.filter(k=>k.fachId===fid).forEach(k=>{ const r=((S.pk||{})[k.id]||{}).results; const last=r&&r[r.length-1]; if(!last) return;
    k.aufgaben.forEach(a=>{ const x=last.aufgaben[a.nr]; if(x&&[].concat(a.thema||[]).includes(name)) parts.push(x.erreicht/x.max); }); });
  if(!parts.length) return null;
  const pct=parts.reduce((s,x)=>s+x,0)/parts.length, pk=pctToPunkte(pct);
  return {pct,punkte:pk,ampel:ampelFromPunkte(pk)};
}
function avgWissen(list){ if(!list.length) return null; const pct=list.reduce((s,x)=>s+x.pct,0)/list.length, pk=pctToPunkte(pct); return {pct,punkte:pk,ampel:ampelFromPunkte(pk),n:list.length}; }
function fachWissen(fid){ const w=avgWissen(F(fid).themen.map(t=>themaWissen(fid,t.name)).filter(Boolean)); if(w) w.total=F(fid).themen.length; return w; }
function gesamtWissen(){ return avgWissen(faecher().map(f=>fachWissen(f.id)).filter(Boolean)); }
function effAmpel(fid,t){ const w=themaWissen(fid,t.name); return w?w.ampel:t.ampel; }
const AMP_CLS={rot:'a-rot',gelb:'a-gelb',gruen:'a-gruen'};
function wissenHtml(w,big){ if(!w) return '<span class="muted small">noch keine Daten</span>';
  return `<span class="dot ${AMP_CLS[w.ampel]}" style="${big?'width:16px;height:16px':''}"></span><b style="${big?'font-size:22px':''}">≈ ${w.punkte} P.</b> <span class="muted">(Note ${NOTEN[w.punkte]})</span>`; }
const AMPEL_LEGENDE='<span class="dot a-rot"></span>bis 3− (≤ 7 P.) · <span class="dot a-gelb"></span>3 bis 2 (8–11 P.) · <span class="dot a-gruen"></span>ab 2+ (≥ 12 P.)';

/* ---------- Lernkreislauf: Baustellen (Fokus) aus Lerneinheiten, KI-Feedback und Claude-Chat ---------- */
function fokusList(){ S.fokus=S.fokus||[]; return S.fokus; }
function addFokus(fid,begriff,stichworte,quelle){
  const L=fokusList(), n=norm(begriff);
  const f=L.find(x=>!x.erledigt&&x.fid===fid&&norm(x.begriff)===n);
  if(f){ f.treffer=0; f.datum=today(); return; }
  L.push({id:uid(),fid,begriff,stichworte:(stichworte&&stichworte.length?stichworte:[begriff]).map(norm).filter(Boolean),quelle,datum:today(),treffer:0,erledigt:null});
}
function qText(key){
  const i=key.indexOf(':'), d=DECKS.find(x=>x.id===key.slice(0,i)), iid=key.slice(i+1); if(!d) return '';
  const c=(d.cards||[]).find(x=>x.id===iid); if(c) return norm(c.front+' '+c.back+' '+(c.extra||''));
  const it=(d.items||[]).find(x=>x.id===iid); return it?norm(it.frage+' '+(it.richtige?it.richtige.map(i=>it.antworten[i]).join(' '):it.antworten[it.richtig])+' '+(it.erklaerung||'')):'';
}
const fokusMatches=(f,key)=>{ const t=qText(key); return f.stichworte.some(w=>w&&t.includes(w)); };
const openFokus=fid=>fokusList().filter(f=>!f.erledigt&&(!fid||f.fid===fid));
function fokusKeys(fid){ const fs=openFokus(fid); if(!fs.length) return []; return decksFor(fid).flatMap(d=>allCards(d).map(c=>c.key)).filter(k=>fs.some(f=>fokusMatches(f,k))); }
function fokusProgress(key,ok){
  fokusList().forEach(f=>{ if(f.erledigt||!fokusMatches(f,key)) return;
    if(ok){ f.treffer=(f.treffer||0)+1; if(f.treffer>=3) f.erledigt=today(); } else f.treffer=0; });
}
const isWeak=(q,fid)=>(S.ans&&S.ans[q.key]&&S.ans[q.key].slice(-1)[0]===0)||openFokus(fid).some(f=>fokusMatches(f,q.key));
function fokusCard(fid){
  const open=openFokus(fid), done=fokusList().filter(f=>f.erledigt&&(!fid||f.fid===fid)).slice(-5).reverse();
  const staerken=(S.staerken||[]).filter(x=>!fid||x.fid===fid).slice(-6).reverse();
  if(!open.length&&!done.length&&!staerken.length) return `<div class="card"><h2>🎯 Meine Baustellen</h2><div class="empty">Noch keine. Sie entstehen automatisch aus Lerneinheiten und aus dem Feedback von Claude (📥 Rückmeldung einfügen).</div></div>`;
  const fs=[...new Set(open.map(f=>f.fid))];
  return `<div class="card"><div class="row between"><h2>🎯 Meine Baustellen</h2><span class="chip">${open.length} offen · ${fokusList().filter(f=>f.erledigt&&(!fid||f.fid===fid)).length} gemeistert</span></div>
    ${open.map(f=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(f.begriff)} <span class="small muted">· ${esc((fachById(f.fid)||{}).name||'')} · ${esc(f.quelle)} · ${de(f.datum)}</span></span>
      <span title="3× richtig in Folge = gemeistert">${[0,1,2].map(i=>`<span class="dot ${i<(f.treffer||0)?'a-gruen':''}" style="${i<(f.treffer||0)?'':'border:1px solid var(--muted)'}"></span>`).join('')}</span></div>`).join('')}
    <div class="row" style="margin-top:10px">${fs.map(x=>{ const n=fokusKeys(x).length; return n?`<button class="primary small" data-fokus="${x}">🎯 Fokus-Training ${esc((fachById(x)||{}).name||'')} (${Math.min(n,QUIZ_LEN)} Fragen)</button>`:''; }).join('')}</div>
    ${done.length?`<p class="small" style="margin:10px 0 0">✔ Gemeistert: ${done.map(f=>esc(f.begriff)+' ('+de(f.erledigt)+')').join(' · ')}</p>`:''}
    ${staerken.length?`<p class="small muted" style="margin:6px 0 0">💪 Stärken laut Claude: ${staerken.map(x=>esc(x.begriff)).join(' · ')}</p>`:''}</div>`;
}
function startFokus(fid){ const keys=fokusKeys(fid);
  if(!keys.length){ alert('Zu deinen offenen Baustellen gibt es gerade keine passenden Quizfragen. Übe sie über „Klassisch lernen“ oder eine Probeklausur.'); return; }
  startQuiz({id:'fokus-'+fid,fachId:fid,titel:'Fokus-Training',quelle:'deine Baustellen',decks:decksFor(fid),onlyKeys:keys},QUIZ_LEN,false); }
function bindFokus(){ bind('[data-fokus]',b=>startFokus(b.dataset.fokus)); }
/* Lernstand-Code aus dem Claude-Chat übernehmen */
function applyUpdate(u){
  if(!u||typeof u!=='object') throw new Error('Kein gültiger Lernstand-Code.');
  if(u.spieler&&u.spieler!==player) throw new Error(`Dieser Code ist für „${u.spieler}“, angemeldet ist ${player}.`);
  const fid=u.fach; if(!fachById(fid)) throw new Error('Unbekanntes Fach im Code.');
  let msg=[];
  if(u.einheit&&u.punkte!=null){ S.klassisch=S.klassisch||{}; const r=S.klassisch[u.einheit]||{date:today(),covered:null,total:null,self:null,selfLabel:'von Claude bewertet'};
    r.punkte=Math.max(0,Math.min(15,+u.punkte)); r.date=today(); S.klassisch[u.einheit]=r; msg.push(`Punkte: ${r.punkte}/15 (Note ${NOTEN[r.punkte]})`); }
  if(u.klausur&&(u.aufgaben||u.erwartung)){ const k=KLAUSUREN.find(x=>x.id===u.klausur);
    if(k){ const auf={}; k.aufgaben.forEach(a=>{ const ev=(u.erwartung||{})[a.nr]??(u.erwartung||{})[String(a.nr)], kom=((u.kommentare||{})[a.nr]||(u.kommentare||{})[String(a.nr)]||{});
        const kommentare={}; Object.entries(kom).forEach(([i,t])=>{ kommentare[(+i)-1]=t; });
        if(Array.isArray(ev)){ const items=a.erwartung.map((e,i)=>Math.max(0,Math.min(e.be,+(ev[i]||0))));
          items.forEach((v,i)=>{ if(v<a.erwartung[i].be) addFokus(k.fachId,a.erwartung[i].text,a.erwartung[i].stichworte,'Claude (Klausur)'); });
          auf[a.nr]={erreicht:items.reduce((s,x)=>s+x,0),max:a.be,items,kommentare}; }
        else { const v=(u.aufgaben||{})[a.nr]??(u.aufgaben||{})[String(a.nr)]; if(v!=null) auf[a.nr]={erreicht:Math.max(0,Math.min(a.be,+v)),max:a.be,kommentare}; } });
      const er=Object.values(auf).reduce((s,x)=>s+x.erreicht,0), mx=Object.values(auf).reduce((s,x)=>s+x.max,0)||1, pk=pctToPunkte(er/mx);
      S.pk=S.pk||{}; S.pk[k.id]=S.pk[k.id]||{}; const prevAns=((S.pk[k.id].results||[]).slice(-1)[0]||{}).antworten||S.pk[k.id].draft||{};
      (S.pk[k.id].results=S.pk[k.id].results||[]).push({date:today(),aufgaben:auf,be:er,max:mx,punkte:pk,quelle:'Claude',antworten:Object.assign({},prevAns),berichtigung:{}});
      msg.push('📋 Korrekturbogen unter Probeklausur');
      msg.push(`Probeklausur: ${er}/${mx} BE → ${pk} P. (Note ${NOTEN[pk]})`); } }
  (u.fokus||[]).forEach(f=>addFokus(fid,f.begriff||f,f.stichworte||[],'Claude'));
  if((u.fokus||[]).length) msg.push(`${u.fokus.length} Baustelle(n) übernommen`);
  S.staerken=S.staerken||[]; (u.staerken||[]).forEach(b=>S.staerken.push({fid,begriff:b,datum:today()}));
  if((u.staerken||[]).length) msg.push(`${u.staerken.length} Stärke(n) notiert`);
  markDay(); S.history.push({date:today(),deck:u.einheit?'einheit:'+u.einheit:'claude',mode:'Claude-Feedback',score:u.punkte??0,total:15}); save();
  return msg.join(' · ')||'Übernommen.';
}
function parseUpdate(txt){ const i=txt.indexOf('{'), j=txt.lastIndexOf('}'); if(i<0||j<i) throw new Error('Im eingefügten Text wurde kein Lernstand-Code gefunden.'); return JSON.parse(txt.slice(i,j+1)); }
function openImport(){
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="card" style="max-width:520px"><h2>📥 Rückmeldung von Claude einfügen</h2>
    <p class="small muted">Kopiere den Block <b>LERNSTAND-UPDATE</b> unter Claudes Feedback (oder einfach die ganze Antwort) und füge ihn hier ein. Punkte, Stärken und Baustellen werden in deinem Profil gespeichert – nur auf diesem Gerät.</p>
    <textarea id="imp" style="min-height:160px" placeholder="LERNSTAND-UPDATE { … }"></textarea>
    <div class="row" style="margin-top:8px"><button class="primary" id="impok">Übernehmen</button><button id="impx">Schließen</button></div><div id="impr" class="small" style="margin-top:8px"></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#impx').onclick=()=>{ ov.remove(); render(); };
  ov.querySelector('#impok').onclick=()=>{ const r=ov.querySelector('#impr');
    try{ r.textContent='✔ '+applyUpdate(parseUpdate(ov.querySelector('#imp').value)); r.style.color='var(--ok)'; }
    catch(e){ r.textContent='✘ '+e.message; r.style.color='var(--bad)'; } };
}
const UPDATE_ANWEISUNG=(fid,eid)=>`\n\nBitte schließe dein Feedback mit einem Block ab, den ich in meine Lern-App übernehmen kann – genau in diesem Format:\nLERNSTAND-UPDATE\n{"spieler":"${player}","fach":"${fid}","einheit":"${eid||''}","punkte":<0-15 oder null>,"staerken":["…"],"fokus":[{"begriff":"…","stichworte":["wortanfang1","wortanfang2"]}]}`;

/* ---------- Sichern / Laden ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify({app:'lern-cockpit',version:1,player,exported:today(),state:S},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`lern-cockpit_${player}_${today()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}
document.getElementById('importFile').onchange=e=>{
  const file=e.target.files[0]; if(!file) return; const r=new FileReader();
  r.onload=()=>{ try{
      const data=JSON.parse(r.result);
      if(!['lern-cockpit','lern-arena'].includes(data.app)||!data.state) throw new Error('Keine Lern-Cockpit-Datei');
      if(!confirm(`Fortschritt von „${data.player}“ (${data.exported}) für ${player} laden? Der aktuelle Stand wird ersetzt.`)) return;
      store.set('lerncockpit:v1:'+player,data.state); load(); go({name:'home'});
    }catch(err){ alert('Die Datei konnte nicht geladen werden: '+err.message); } e.target.value=''; };
  r.readAsText(file);
};

/* ---------- Timer: 20 Min. Satz + 5 Min. Pause ---------- */
let tEnd=null, tLeft=20*60, tPhase='Satz', tInt=null;
const tFmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function tick(){
  tLeft=Math.max(0,Math.round((tEnd-Date.now())/1000));
  if(tLeft===0){ clearInterval(tInt); tInt=null;
    if(tPhase==='Satz'){ tPhase='Pause'; tLeft=5*60; alert('Satz geschafft! 5 Minuten Pause.'); } else { tPhase='Satz'; tLeft=20*60; alert('Pause vorbei – bereit für den nächsten Satz?'); } }
  updTimer();
}
function updTimer(){
  document.getElementById('timerBtn').textContent=tInt?'⏱ '+tFmt(tLeft):'⏱ Satz';
  const el=document.getElementById('timer'); if(!el) return;
  document.getElementById('tPh').textContent=tPhase==='Satz'?'Lernblock':'Pause'; el.textContent=tFmt(tLeft); document.getElementById('tGo').textContent=tInt?'Pause':'Start';
}
document.getElementById('timerBtn').onclick=()=>{
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="card center"><h2 id="tPh"></h2><div class="huge" id="timer"></div><p class="small muted">20 Minuten konzentriert, dann 5 Minuten Pause – wie ein Satz im Training.</p>
    <div class="row" style="justify-content:center"><button class="primary" id="tGo"></button><button id="tReset">Neu</button><button id="tClose">Schließen</button></div></div>`;
  document.body.appendChild(ov);
  document.getElementById('tGo').onclick=()=>{ if(tInt){ clearInterval(tInt); tInt=null; } else { tEnd=Date.now()+tLeft*1000; tInt=setInterval(tick,500); } updTimer(); };
  document.getElementById('tReset').onclick=()=>{ clearInterval(tInt); tInt=null; tPhase='Satz'; tLeft=20*60; updTimer(); };
  document.getElementById('tClose').onclick=()=>ov.remove();
  updTimer();
};
document.getElementById('playerBtn').onclick=()=>{ if(player) save(); player=null; render(); };
document.getElementById('logo').onclick=()=>{ if(player) go({name:'home'}); };

if(player) load();
render();
})();
</script>
